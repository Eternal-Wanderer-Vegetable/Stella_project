<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Stella 运行状态</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>运行状态</h1>
      <span class="ver">v2.4.0</span>
    </header>
    <p class="subtitle">启动、停止与实时日志。遇到问题时点「复制诊断信息」，内容可直接贴进 issue。</p>


    <div id="root"></div>
  </div>


  <script type="module">
    import { getStatus, readLogTail, startBot, stopBot, copyText } from "./api.js";


    // 原型用：手工切换场景。移植时删掉 scenario 相关代码
    let scenario = "running";
    let logs = [];
    // 默认隐藏 DEBUG：它量大且多为内部细节，普通用户不需要
    const levelOn = { ERROR: true, WARNING: true, SUCCESS: true, INFO: true, DEBUG: false };
    let follow = true;
    let busy = false;
    let timer = null;


    function fmtDur(sec) {
      if (sec == null) return "—";
      if (sec < 60) return `${Math.round(sec)} 秒`;
      if (sec < 3600) return `${Math.floor(sec / 60)} 分钟`;
      return `${(sec / 3600).toFixed(1)} 小时`;
    }


    function fmtTime(iso) {
      // 只显示时分秒：日志区是「最近发生什么」，日期反而占位置
      return iso.slice(11, 19);
    }


    /** 三态判定：停止 / 运行但链路异常 / 正常。
        「进程活着但链路断了」必须单独呈现——用户看到「运行中」却收不到回复会以为是 Bot 坏了。 */
    function phase(st) {
      if (!st.alive) return "stopped";
      if (st.link && st.link.enabled && !st.link.healthy) return "degraded";
      return "running";
    }


    const PHASE_TEXT = {
      stopped: "已停止",
      degraded: "运行中，但 OneBot 链路异常",
      running: "运行中",
    };


    function render(st) {
      const ph = phase(st);
      const lk = st.link;


      root.innerHTML = `
        <div class="status-card">
          <span class="dot ${ph}"></span>
          <div class="status-main">
            <div class="status-line">${PHASE_TEXT[ph]}</div>
            <div class="status-sub">
              ${st.alive ? `PID ${st.pid}` : "进程未运行"}
              ${lk && lk.connected ? ` · QQ ${lk.bot_self_id} · 已连接 ${fmtDur(lk.connected_seconds)}` : ""}
            </div>
          </div>
          <div class="ops">
            ${st.alive
              ? `<button id="btn-stop" ${busy ? "disabled" : ""}>${busy ? "停止中…" : "停止"}</button>`
              : `<button class="primary" id="btn-start" ${busy ? "disabled" : ""}>${busy ? "启动中…" : "启动"}</button>`}
            <button id="btn-copy">复制诊断信息</button>
          </div>
        </div>


        ${lk ? `
        <div class="link-row">
          <div class="item"><span class="k">链路</span>
            <span class="v ${lk.healthy ? "good" : "bad"}">${lk.healthy ? "健康" : "异常"}</span></div>
          <div class="item"><span class="k">最近事件</span>
            <span class="v">${fmtDur(lk.last_event_seconds_ago)}前</span></div>
          <div class="item"><span class="k">超时阈值</span>
            <span class="v">${lk.timeout} 秒</span></div>
          ${lk.last_probe_ok !== null ? `
          <div class="item"><span class="k">最近探活</span>
            <span class="v ${lk.last_probe_ok ? "good" : "bad"}">${lk.last_probe_ok ? "成功" : "失败"}</span></div>` : ""}
        </div>` : ""}


        <div class="sched-row">
          <span class="sched-label">调度器</span>
          ${schedHTML(st.scheduler)}
        </div>


        <div class="log-bar">
          <h2>日志</h2>
          <div class="lv-filter">
            ${Object.keys(levelOn).map(lv =>
              `<button data-lv="${lv}" data-on="${levelOn[lv] ? 1 : 0}">${lv}</button>`).join("")}
          </div>
          <span class="spacer"></span>
          <label class="follow-tag">
            <input type="checkbox" id="chk-follow" ${follow ? "checked" : ""} />跟随最新
          </label>
          <select id="sel-scenario">
            <option value="running">场景：运行中</option>
            <option value="disconnected">场景：链路断开</option>
            <option value="stopped">场景：已停止</option>
          </select>
        </div>


        <div class="log-view" id="log-view">${logHTML()}</div>
      `;


      const lv = root.querySelector("#log-view");
      if (follow) lv.scrollTop = lv.scrollHeight;


      // 用户手动上滚即取消跟随——强行拉回底部是最招人烦的交互
      lv.onscroll = () => {
        const atBottom = lv.scrollHeight - lv.scrollTop - lv.clientHeight < 30;
        if (!atBottom && follow) {
          follow = false;
          root.querySelector("#chk-follow").checked = false;
        }
      };


      root.querySelectorAll(".lv-filter button").forEach(b => {
        b.onclick = () => {
          levelOn[b.dataset.lv] = !levelOn[b.dataset.lv];
          refresh();
        };
      });
      root.querySelector("#chk-follow").onchange = (e) => { follow = e.target.checked; };
      const bs = root.querySelector("#btn-start");
      if (bs) bs.onclick = onStart;
      const bt = root.querySelector("#btn-stop");
      if (bt) bt.onclick = onStop;
      root.querySelector("#btn-copy").onclick = () => copyDiag(st);
      const ss = root.querySelector("#sel-scenario");
      ss.value = scenario;
      ss.onchange = (e) => { scenario = e.target.value; refresh(); };
    }


    function logHTML() {
      const shown = logs.filter(l => levelOn[l.level]);
      if (!shown.length) return `<div class="log-empty">没有符合当前过滤条件的日志</div>`;
      return shown.map(l => `
        <div class="log-line ${l.level}">
          <span class="t">${fmtTime(l.ts)}</span>
          <span class="lv">${l.level}</span>
          <span class="mod">${l.module}</span>
          <span class="msg">${escapeHTML(l.message)}</span>
        </div>`).join("");
    }


    function escapeHTML(s) {
      return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }


    /** 调度器摘要：有排队时突出显示；空 dict（懒建资源从未 acquire 过）给兜底文案。 */
    function schedHTML(sched) {
      const s = sched || {};
      const names = Object.keys(s);
      if (!names.length) return `<span class="sched-empty">暂无调度记录</span>`;
      return names.map(name => {
        const d = s[name];
        const wait = d.waiting
          ? `<span class="w">排队 ${d.waiting} 个</span>`
          : "空闲";
        const holder = d.holder ? ` · ${d.holder}` : "";
        return `<span class="sched-item">${name}：${wait}${holder}</span>`;
      }).join("");
    }


    /** 诊断信息面向「贴进 issue」：环境摘要 + 最近的 error/warning，而非日志全文。
        全文往往几千行且含群聊内容，贴出来既没人看也可能泄漏隐私。 */
    async function copyDiag(st) {
      const bad = logs.filter(l => l.level === "ERROR" || l.level === "WARNING").slice(-15);
      const lines = [
        "### Stella 诊断信息",
        "",
        `- 版本：v2.4.0`,
        `- 进程：${st.alive ? `运行中（PID ${st.pid}）` : "已停止"}`,
      ];
      if (st.link) {
        lines.push(
          `- 链路：${st.link.healthy ? "健康" : "异常"}`
          + `（已连接 ${fmtDur(st.link.connected_seconds)}，最近事件 ${fmtDur(st.link.last_event_seconds_ago)}前）`
        );
      }
      lines.push("", `#### 最近 ${bad.length} 条 error/warning`, "", "```");
      for (const l of bad) {
        lines.push(`${fmtTime(l.ts)} [${l.level}] ${l.module} | ${l.message}`);
      }
      lines.push("```", "",
        "> 提示：如需完整日志，见 logs/stella.jsonl；贴出前请确认其中没有你不想公开的群聊内容。");
      await copyText(lines.join("\n"));
      const b = root.querySelector("#btn-copy");
      b.textContent = "已复制";
      setTimeout(() => (b.textContent = "复制诊断信息"), 1600);
    }


    async function onStart() {
      busy = true; refresh();
      await startBot();
      busy = false; scenario = "running"; refresh();
    }


    async function onStop() {
      busy = true; refresh();
      await stopBot();
      busy = false; scenario = "stopped"; refresh();
    }


    const root = document.getElementById("root");


    async function refresh() {
      const [st, lg] = await Promise.all([getStatus(scenario), readLogTail(200)]);
      logs = lg;
      render(st);
    }


    refresh();
    // 轮询：1.5 秒足够「看机器人在干什么」，且避免频繁读文件
    timer = setInterval(() => { if (!busy) refresh(); }, 1500);
  </script>
</body>
</html>
