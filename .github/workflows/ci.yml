name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 取消正在运行的旧工作流，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 代码质量检查 ============
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            setup.py

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (linter)
        run: ruff check . --output-format=github

  # ============ 安全扫描 ============
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: safety check -r requirements.txt --full-report

      - name: Run Bandit (security linter)
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # ============ 单元测试（多版本） ============
  test:
    needs: [lint, security]  # 等待检查通过后再跑测试，节省资源
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      # 即使某个版本失败，继续测试其他版本
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true  # 开发依赖可选
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: cov-${{ matrix.python-version }}
        run: |
          pytest tests/ \
            -v \
            --cov=. \
            --cov-branch \
            -n auto \
            --dist loadgroup

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            cov-${{ matrix.python-version }}

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            test-output.log

  # ============ 覆盖率报告（合并） ============
  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Install coverage tools
        run: pip install coverage

      - name: Combine coverage reports
        run: coverage combine cov-*

      - name: Generate combined report
        run: |
          coverage report --fail-under=80
          coverage xml -o combined-coverage.xml

      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        if: hashFiles('combined-coverage.xml') != ''
        with:
          name: combined-coverage
          path: combined-coverage.xml

      - name: Post coverage to PR
        uses: orgoro/coverage@v3
        if: github.event_name == 'pull_request' && hashFiles('combined-coverage.xml') != ''
        with:
          coverageFile: combined-coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============ 通知（可选） ============
  notify:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Check status
        id: status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.security.result }}" == "success" ]; then
            echo "status=✅ All checks passed!" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Some checks failed. Please check the logs." >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.status.outputs.status }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CI 运行结果\n\n${status}\n\n[查看详细日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });