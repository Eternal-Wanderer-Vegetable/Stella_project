<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Stella</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>运行状态</h1>
      <span class="ver">v2.6.0</span>
      <!-- 自检是排查工具而非日常页面，降级为角落里的次要入口。
           出问题时由界面主动提示用户点它（见 renderError / 状态提示条）。 -->
      <nav class="top-nav">
        <a class="nav-secondary" href="./run.html">运行状态</a>
        <a class="nav-secondary" href="./config.html">配置</a>
        <a class="nav-secondary" href="./persona.html">人格设定</a>
        <a class="nav-secondary" href="./doctor.html">环境自检</a>
      </nav>
    </header>
    <p class="subtitle">启动、停止与实时日志。遇到问题时点「复制诊断信息」，内容可直接贴进 issue。</p>
    <div id="root"><div class="loading">正在加载运行状态与日志…</div></div>
  </div>

  <script type="module">
     import { getStatus, readLogTail, startBot, stopBot, copyText, getVersion, installCloseOverlay } from "./api.js";

     const root = document.getElementById("root");
     let appVersion = "";
     installCloseOverlay();
     getVersion().then(v => { appVersion = v; document.querySelector(".ver").textContent = `v${v}`; }).catch(() => {});
    let logs = [];
    let lastStatus = null;
    let lastError = null;
    const levelOn = { ERROR: true, WARNING: true, SUCCESS: true, INFO: true, DEBUG: false };
      let follow = true;
      let busy = false;
      let busySince = 0;
      let timer = null;
      let lastLogSig = "";
      let lastStatusSig = "";

    function fmtDur(sec) {
      if (sec == null) return "—";
      if (sec < 60) return `${Math.round(sec)} 秒`;
      if (sec < 3600) return `${Math.floor(sec / 60)} 分钟`;
      return `${(sec / 3600).toFixed(1)} 小时`;
    }

    // token 数动辄六位数，千分位是可读性的下限；万以上再折成 k 就够了
    function fmtNum(n) {
      const v = Number(n || 0);
      if (!isFinite(v)) return "0";
      if (v >= 10000) return `${(v / 1000).toFixed(1)}k`;
      return v.toLocaleString("zh-CN");
    }

    function fmtTime(iso) { return iso ? iso.slice(11, 19) : "??:??:??"; }
    function escapeHTML(s) {
      return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    function phase(st) {
      if (!st.alive) return "stopped";
      if (st.link && st.link.enabled && !st.link.healthy) return "degraded";
      return "running";
    }

    const PHASE_TEXT = {
      stopped: "已停止",
      degraded: "运行中，但 OneBot 链路异常",
      running: "运行中",
    };

    function ensureSkeleton() {
      if (root.querySelector("#status-area")) return;
      root.innerHTML = `
        <div id="status-area"></div>
        <div id="link-area"></div>
        <div id="sched-area"><div class="sched-row"><span class="sched-label">调度器</span><span id="sched-content"></span></div></div>
        <div id="usage-area"></div>
        <div id="logs-area">
          <div class="log-bar">
            <h2>日志</h2>
            <div class="lv-filter">${Object.keys(levelOn).map(lv => `<button data-lv="${lv}" data-on="${levelOn[lv] ? 1 : 0}">${lv}</button>`).join("")}</div>
            <span class="spacer"></span>
            <label class="follow-tag"><input type="checkbox" id="chk-follow" ${follow ? "checked" : ""} />跟随最新</label>
          </div>
          <div class="log-view" id="log-view"></div>
        </div>`;
      // 级别过滤：只绑定一次，避免每次刷新重建导致选中态丢失
      root.querySelectorAll(".lv-filter button").forEach(b => {
        b.onclick = () => {
          levelOn[b.dataset.lv] = !levelOn[b.dataset.lv];
          b.dataset.on = levelOn[b.dataset.lv] ? "1" : "0";
          renderLogs();
        };
      });
      const chk = root.querySelector("#chk-follow");
      if (chk) chk.onchange = e => {
        follow = e.target.checked;
        if (follow) {
          const lv = root.querySelector("#log-view");
          if (lv) lv.scrollTop = lv.scrollHeight;
        }
      };
      const lv = root.querySelector("#log-view");
      if (lv) {
        lv.onscroll = () => {
          const atBottom = lv.scrollHeight - lv.scrollTop - lv.clientHeight < 30;
          if (!atBottom && follow) { follow = false; const c = root.querySelector("#chk-follow"); if (c) c.checked = false; }
        };
      }
    }

    function statusSig(st) {
      try {
        return JSON.stringify([st.alive, st.pid, st.api_reachable, st.pid_file_present, st.link, st.scheduler, st.usage, busy, busySince, lastError]);
      } catch { return String(Date.now()); }
    }

    function renderStatus(st) {
      ensureSkeleton();
      const sig = statusSig(st);
      // 忙碌文案每 5 秒会变，跳过签名短路以便更新“停止中…”提示
      const needForce = busy && Date.now() - busySince > 5000;
      if (!needForce && sig === lastStatusSig) return;
      lastStatusSig = sig;
      const ph = phase(st);
      const lk = st.link;
      const orphan = st.alive && st.api_reachable && !st.pid_file_present;
      const stoppingText = busy && Date.now() - busySince > 5000
        ? "停止中（正在收尾记忆整合）…"
        : "停止中…";
      const opsHTML = st.alive
        ? (orphan
            ? `<button disabled title="该进程不是本工具启动的，无法从这里停止">停止</button>`
            : `<button id="btn-stop" ${busy ? "disabled" : ""}>${busy ? stoppingText : "停止"}</button>`)
        : `<button class="primary" id="btn-start" ${busy ? "disabled" : ""}>${busy ? "启动中…" : "启动"}</button>`;
      const orphanNote = orphan ? `
        <div class="notice">
          <span class="notice-icon">i</span>
          <div>
            这个进程不是由本工具启动的，因此无法从这里停止。
            <div class="notice-sub">在启动它的那个终端按 <code>Ctrl+C</code>，或在项目根目录执行
              <code>python -m deploy stop</code>（若它当初是用 <code>--detach</code> 启动的）。
              之后用本工具的「启动」按钮重新启动，即可获得完整的启停控制。</div>
          </div>
        </div>` : "";
      const stalePidNote = !st.api_reachable && st.pid_file_present ? `
        <div class="notice">
          <span class="notice-icon">i</span>
          <div>记录到进程 PID ${st.pid ?? "—"} 但状态接口连不上。可能是：
            <div class="notice-sub">① 仍在启动中（等几秒再看）；② 状态接口被关闭（<code>STELLA_STATUS_API_ENABLED=false</code>）；③ 进程已退出但 PID 文件残留 —— 点「停止」可清理。</div>
          </div>
        </div>` : "";
      const errorNote = lastError ? `
        <div class="notice notice-error">
          <span class="notice-icon">!</span>
          <div>无法获取最新状态：<code>${escapeHTML(lastError)}</code>
            <div class="notice-sub">界面显示的是最后一次成功获取的数据。</div>
          </div>
        </div>` : "";

      const statusArea = root.querySelector("#status-area");
      // 状态卡 + 通知条：与日志区解耦，更新状态时不再重建日志节点，保留用户选区
      statusArea.innerHTML = `
        <div class="status-card">
          <span class="dot ${ph}"></span>
          <div class="status-main">
            <div class="status-line">${PHASE_TEXT[ph]}</div>
            <div class="status-sub">${st.alive ? `PID ${st.pid ?? "—"}` : "进程未运行"}${lk && lk.connected ? ` · QQ ${lk.bot_self_id ?? "?"} · 已连接 ${fmtDur(lk.connected_seconds)}` : ""}</div>
          </div>
          <div class="ops">${opsHTML}<button id="btn-copy">复制诊断信息</button></div>
        </div>
        ${errorNote}${orphanNote}${stalePidNote}`;

      const linkArea = root.querySelector("#link-area");
      if (lk) {
        if (lk.connected) {
          linkArea.innerHTML = `
        <div class="link-row">
          <div class="item"><span class="k">链路</span><span class="v ${lk.healthy ? "good" : "bad"}">${lk.healthy ? "健康" : "异常"}</span></div>
          <div class="item"><span class="k">最近事件</span><span class="v">${fmtDur(lk.last_event_seconds_ago)}前</span></div>
          <div class="item"><span class="k">超时阈值</span><span class="v">${lk.timeout ?? "—"} 秒</span></div>
          ${lk.last_probe_ok !== null ? `<div class="item"><span class="k">最近探活</span><span class="v ${lk.last_probe_ok ? "good" : "bad"}">${lk.last_probe_ok ? "成功" : "失败"}</span></div>` : ""}
        </div>`;
        } else {
          linkArea.innerHTML = `<div class="link-row"><div class="item"><span class="k">链路</span><span class="v bad">协议端未连接</span></div><div class="item"><span class="k">检查</span><span class="v">NapCat 是否运行并已登录</span></div></div>`;
        }
      } else {
        linkArea.innerHTML = ``;
      }

      const schedContent = root.querySelector("#sched-content");
      if (schedContent) schedContent.innerHTML = schedHTML(st.scheduler);

      const usageArea = root.querySelector("#usage-area");
      if (usageArea) usageArea.innerHTML = usageHTML(st.usage);

      // 仅在状态区内绑定按钮，避免触碰日志区
      const bs = statusArea.querySelector("#btn-start");
      if (bs) bs.onclick = onStart;
      const bt = statusArea.querySelector("#btn-stop");
      if (bt) bt.onclick = onStop;
      const bc = statusArea.querySelector("#btn-copy");
      if (bc) bc.onclick = () => copyDiag(st);
    }

    function logSig() {
      // 签名：过滤状态 + 日志尾部指纹；未变化时跳过 innerHTML 重建以保留选区
      const last = logs[logs.length - 1];
      const first = logs[0];
      return `${logs.length}|${first?.ts ?? ""}|${last?.ts ?? ""}|${last?.message?.slice(0,32) ?? ""}|${JSON.stringify(levelOn)}`;
    }

    function renderLogs() {
      ensureSkeleton();
      const sig = logSig();
      if (sig === lastLogSig) return;
      lastLogSig = sig;
      const lv = root.querySelector("#log-view");
      if (!lv) return;
      const atBottom = lv.scrollHeight - lv.scrollTop - lv.clientHeight < 30;
      const prevTop = lv.scrollTop;
      const shouldFollow = follow || atBottom;
      lv.innerHTML = logHTML();
      // 恢复滚动：跟随开启时贴底，否则保持原位置，避免每 1.5s 打断用户复制
      if (shouldFollow) lv.scrollTop = lv.scrollHeight;
      else lv.scrollTop = prevTop;
      // 同步过滤按钮选中态（不重建节点，仅改属性）
      root.querySelectorAll(".lv-filter button").forEach(b => {
        b.dataset.on = levelOn[b.dataset.lv] ? "1" : "0";
      });
      const chk = root.querySelector("#chk-follow");
      if (chk) chk.checked = follow;
    }

    // 兼容旧调用：render 拆为两个子渲染，日志侧带签名短路
    function render(st) {
      renderStatus(st);
      renderLogs();
    }

    function renderError() {
      if (lastStatus) { render(lastStatus); return; }
      root.innerHTML = `<div class="notice notice-error"><span class="notice-icon">!</span><div>无法获取状态：<code>${escapeHTML(lastError)}</code><div class="notice-sub">请确认 Python 环境可用，或手工执行 <code>python -m deploy status --json</code>。</div></div></div>`;
      lastLogSig = "";
      lastStatusSig = "";
    }

    function logHTML() {
      const shown = logs.filter(l => levelOn[l.level]);
      if (!shown.length) return `<div class="log-empty">没有符合当前过滤条件的日志</div>`;
      return shown.map(l => `<div class="log-line ${l.level}"><span class="t">${fmtTime(l.ts)}</span><span class="lv">${escapeHTML(l.level)}</span><span class="mod">${escapeHTML(l.module)}</span><span class="msg">${escapeHTML(l.message)}</span></div>`).join("");
    }

    function schedHTML(sched) {
      const s = sched || {};
      const names = Object.keys(s);
      if (!names.length) return `<span class="sched-empty">暂无排队</span>`;
      return names.map(name => {
        const d = s[name] || {};
        // 七键：waiting / holder / held_seconds / acquired / avg_wait / avg_hold / peak_waiting
        const waiting = d.waiting ?? 0;
        const holder = d.holder ?? null;
        const held = d.held_seconds ?? 0;
        const acquired = d.acquired ?? 0;
        const avgWait = d.avg_wait ?? 0;
        const avgHold = d.avg_hold ?? 0;
        const peak = d.peak_waiting ?? 0;
        const waitPart = waiting ? `<span class="w">排队 ${waiting}</span>` : `空闲`;
        const holderPart = holder ? ` · 持有者 ${escapeHTML(String(holder))} · 已持有 ${fmtDur(held)}` : (held > 0.5 ? ` · 已持有 ${fmtDur(held)}` : "");
        const statsPart = ` · 累计 ${acquired}次 · 均等待 ${Number(avgWait).toFixed(1)}s · 均持有 ${Number(avgHold).toFixed(1)}s · 峰值 ${peak}`;
        return `<span class="sched-item" title="${escapeHTML(name)}：waiting=${waiting} holder=${holder ?? "-"} held=${held}s acquired=${acquired} avg_wait=${avgWait}s avg_hold=${avgHold}s peak=${peak}">${escapeHTML(name)}：${waitPart}${holderPart}${statsPart}</span>`;
      }).join(" · ");
    }

    function pct(x) { return `${(Number(x || 0) * 100).toFixed(1)}%`; }

    // 用量面板。缓存命中率单独占一格：它是验证前缀缓存到底有没有生效的唯一手段，
    // 一直是 0 就说明 prompt 的固定前缀被什么东西破坏了（改了 persona、加了时间戳…）。
    function usageHTML(usage) {
      const u = usage || null;
      if (!u) return ``;   // 接口不可达 / 老版本 Bot：整块不显示，而不是显示一堆 0
      if (u.accounting === false) {
        return `<div class="link-row"><div class="item"><span class="k">用量记账</span><span class="v">已关闭（LLM_USAGE_ACCOUNTING=false）</span></div></div>`;
      }
      const t = u.totals || {};
      const budget = Number(u.budget || 0);
      const used = Number(u.used_tokens || 0);
      const over = !!u.over_budget;
      const paused = u.paused_roles || [];
      const quotaText = budget > 0
        ? `${fmtNum(used)} / ${fmtNum(budget)}`
        : `${fmtNum(used)}（不限）`;
      const remainPart = budget > 0
        ? `<div class="item"><span class="k">剩余</span><span class="v ${over ? "bad" : "good"}">${fmtNum(u.remaining_tokens ?? 0)}</span></div>`
        : ``;
      const pausedPart = paused.length
        ? `<div class="item"><span class="k">已暂停</span><span class="v bad">${escapeHTML(paused.join("、"))}（${escapeHTML(String(u.action || ""))}）</span></div>`
        : ``;
      const head = `
        <div class="link-row">
          <div class="item"><span class="k">今日 token</span><span class="v ${over ? "bad" : ""}">${quotaText}</span></div>
          ${remainPart}
          <div class="item"><span class="k">调用</span><span class="v">${fmtNum(t.calls || 0)}</span></div>
          <div class="item"><span class="k">失败</span><span class="v ${t.failures ? "bad" : ""}">${fmtNum(t.failures || 0)}</span></div>
          <div class="item"><span class="k">截断</span><span class="v ${t.truncated ? "bad" : ""}">${fmtNum(t.truncated || 0)}</span></div>
          <div class="item" title="分母是输入 token 而不是调用次数。这个数字一直是 0 说明前缀缓存没有生效。"><span class="k">缓存命中率</span><span class="v">${pct(t.cache_hit_rate)}</span></div>
          <div class="item"><span class="k">预算域</span><span class="v">${escapeHTML(String(u.scope || "online"))}</span></div>
          ${pausedPart}
        </div>`;
      const rows = Object.entries(u.by_key || {}).map(([key, d]) => `
        <div class="usage-item">
          <span class="ukey">${escapeHTML(key)}</span>
          <span class="ukind">${escapeHTML(String(d.kind || "-"))}</span>
          <span class="unum">入 ${fmtNum(d.prompt_tokens || 0)}</span>
          <span class="unum">出 ${fmtNum(d.completion_tokens || 0)}</span>
          <span class="unum">缓存 ${pct(d.cache_hit_rate)}</span>
          <span class="unum">${fmtNum(d.calls || 0)} 次</span>
        </div>`).join("");
      const detail = rows
        ? `<div class="usage-list">${rows}</div>`
        : `<div class="usage-list"><span class="sched-empty">今天还没有调用记录</span></div>`;
      const degraded = Object.entries(u.fallback_states || {})
        .filter(([, d]) => d && d.degraded)
        .map(([role, d]) => `${escapeHTML(role)}：${escapeHTML(String(d.primary_slot || "?"))} → ${escapeHTML(String(d.fallback_slot || "?"))}（冷却剩余 ${Number(d.cooldown_remaining || 0).toFixed(0)}s）`);
      const fb = degraded.length
        ? `<div class="link-row"><div class="item"><span class="k">正在降级</span><span class="v bad">${degraded.join(" · ")}</span></div></div>`
        : ``;
      return head + detail + fb;
    }

    async function copyDiag(st) {
      const bad = logs.filter(l => l.level === "ERROR" || l.level === "WARNING").slice(-15);
       const lines = ["### Stella 诊断信息", "", `- 版本：v${appVersion || "unknown"}`, `- 进程：${st.alive ? `运行中（PID ${st.pid ?? "—"}）` : "已停止"}`];
      if (st.link) lines.push(st.link.connected ? `- 链路：${st.link.healthy ? "健康" : "异常"}（已连接 ${fmtDur(st.link.connected_seconds)}，最近事件 ${fmtDur(st.link.last_event_seconds_ago)}前）` : "- 链路：协议端未连接（检查 NapCat 是否运行并已登录）");
      lines.push("", `#### 最近 ${bad.length} 条 error/warning`, "", "```");
      for (const l of bad) lines.push(`${fmtTime(l.ts)} [${l.level}] ${l.module} | ${l.message}`);
      lines.push("```", "", "> 提示：如需完整日志，见 logs/stella.jsonl；贴出前请确认其中没有你不想公开的群聊内容。");
      await copyText(lines.join("\n"));
      const b = root.querySelector("#btn-copy"); if (b) { b.textContent = "已复制"; setTimeout(() => (b.textContent = "复制诊断信息"), 1600); }
    }

    function pausePolling() {
      clearInterval(timer);
      timer = null;
    }

    function resumePolling() {
      timer = setInterval(() => { if (!busy) refresh(); }, 1500);
    }

    async function onStart() {
      pausePolling();
      busy = true; if (lastStatus) renderStatus(lastStatus);
      try {
        await startBot(false);
      } catch (e) {
        busy = false;
        if (confirm(`启动被拒绝：\n\n${e}\n\n仍要强制启动吗？`)) {
          busy = true; if (lastStatus) renderStatus(lastStatus);
          try { await startBot(true); } catch (e2) { alert(`强制启动也失败了：\n${e2}`); }
        }
      } finally {
        busy = false;
        await refresh();
        resumePolling();
      }
    }

    async function onStop() {
      pausePolling();
      busySince = Date.now();
      busy = true; if (lastStatus) renderStatus(lastStatus);
      // 停止可能真等数十秒（在途整合收尾）；超过 5 秒把按钮文案换成提示，
      // 用户就不会以为卡死。轮询已暂停，这里手动触发一次渲染。
      setTimeout(() => { if (busy && lastStatus) renderStatus(lastStatus); }, 5000);
      try { await stopBot(); } catch (e) { alert(`停止失败：\n${e}`); }
      finally {
        busy = false;
        busySince = 0;
        await refresh();
        resumePolling();
      }
    }

    async function refresh() {
      try {
        const st = await getStatus();
        const nextLogs = await readLogTail(st.log_file);
        logs = nextLogs;
        lastStatus = st; lastError = null;
        document.querySelector('.top-nav a[href="./doctor.html"]')?.classList.remove("alert");
        renderStatus(st);
        renderLogs();
      } catch (e) {
        lastError = String(e);
        renderError();
        // 状态获取失败往往是环境问题（Python 挂了、deploy 模块坏了），
        // 主动把自检入口点亮，而不是让用户自己想到去哪儿排查。
        document.querySelector('.top-nav a[href="./doctor.html"]')?.classList.add("alert");
      }
    }

    refresh();
    resumePolling();
  </script>
</body>
</html>
