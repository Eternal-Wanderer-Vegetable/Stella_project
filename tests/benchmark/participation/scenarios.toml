# ============================================================
# benchmark 场景定义（上游工程方案 §30 验收标准 A~F 的可计算版本）
#
# 数据从 group_messages 真实回放中筛选（见 metrics.py 的匹配逻辑），
# expectation 是判定阈值，调参目标是让全部场景通过。
# ============================================================

# A 被明确发问：AT_MENTION 不进评分层（Hard Trigger 旁路）——恒真断言，防回归
[scenario_a_hard_trigger_bypass]
enabled = true

# B 高速刷屏：velocity_count >= high_velocity_at 的评分点上，触发率必须很低
[scenario_b_high_velocity]
enabled = true
high_velocity_at = 6          # 与 weights.toml velocity_penalty.high_at 对齐
max_trigger_rate = 0.05       # ALLOW_LLM 占比上限

# C 强社交钩子：命中悬念词的评分点上，至少要有一定比例进入 CANDIDATE 以上
[scenario_c_social_hook]
enabled = true
min_candidate_rate = 0.10     # CANDIDATE+ALLOW 占比下限（首版宽松，宁缺勿滥）

# D 感兴趣但无机会：命中兴趣锚 + 无问句/钩子的评分点上，沉默占比
[scenario_d_interested_no_opportunity]
enabled = true
min_silence_rate = 0.80       # 非 ALLOW_LLM 占比下限（成功指标：允许沉默）

# E 刚说过话：BOT_SELF 之后 30 秒内的评分均值应显著低于整体基线
[scenario_e_recent_speech]
enabled = true
within_seconds = 30
max_score_ratio = 0.7         # 局部均值 / 全局均值 的上限

# F 话题过期：由单元测试覆盖（需构造时间推进，回放数据天然包含真实间隔，
# 此处统计 COOLING/EXPIRED 状态下绝不触发即可）
[scenario_f_topic_expired]
enabled = true
max_trigger_rate = 0.0        # 过期状态评分点上 ALLOW_LLM 占比上限（硬性）
