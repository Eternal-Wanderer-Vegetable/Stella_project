name: Llama backend packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 4.0.2"
        required: true
        default: "4.0.2"
        type: string
      llama_commit:
        description: "Pinned llama.cpp commit"
        required: true
        type: string
      publish:
        description: "Upload verified backend assets to the matching Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  artifact-metadata: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            backend: cpu
          - os: ubuntu-latest
            target: linux-x86_64
            backend: cuda
          - os: windows-latest
            target: windows-x86_64
            backend: cpu
          - os: windows-latest
            target: windows-x86_64
            backend: vulkan
          - os: macos-latest
            target: macos-arm64
            backend: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_commit }}
          path: .llama.cpp
      - name: Prepare Windows OpenSSL runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @('libcrypto-3-x64.dll', 'libssl-3-x64.dll')
          $roots = @(
            (Join-Path $env:ProgramFiles 'OpenSSL-Win64\bin'),
            (Join-Path $env:ProgramFiles 'OpenSSL\bin'),
            'C:\Program Files\Git\usr\bin',
            'C:\ProgramData\chocolatey\bin'
          )
          function Find-OpenSslDir {
            foreach ($root in $roots) {
              if ((Test-Path (Join-Path $root $required[0])) -and
                  (Test-Path (Join-Path $root $required[1]))) {
                return $root
              }
            }
            return $null
          }
          $opensslDir = Find-OpenSslDir
          if (-not $opensslDir) {
            choco install openssl --yes --no-progress
            $opensslDir = Find-OpenSslDir
          }
          if (-not $opensslDir) {
            throw "Windows OpenSSL runtime not found: $($required -join ', ')"
          }
          "OPENSSL_RUNTIME_DIR=$opensslDir" >> $env:GITHUB_ENV
      - name: Build backend package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          PY_VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -n1)
          CLI_VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' cli/Cargo.toml | head -n1)
          test "$VERSION" = "$PY_VERSION"
          test "$VERSION" = "$CLI_VERSION"
          mkdir -p "dist/Stella-llama-v${VERSION}-${{ matrix.target }}-${{ matrix.backend }}"
          build_args=(
            .llama.cpp
            --output "dist/Stella-llama-v${VERSION}-${{ matrix.target }}-${{ matrix.backend }}"
            --backend '${{ matrix.backend }}'
            --commit '${{ inputs.llama_commit }}'
            --os '${{ matrix.os }}'
            --arch '${{ matrix.target }}'
          )
          if [ '${{ runner.os }}' = 'Windows' ]; then
            build_args+=(--runtime-dir "$OPENSSL_RUNTIME_DIR")
          fi
          python scripts/build_llama_package.py "${build_args[@]}"
      - name: Verify package provenance
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          python scripts/verify_llama_package.py "dist/Stella-llama-v${VERSION}-${{ matrix.target }}-${{ matrix.backend }}"
      - uses: actions/upload-artifact@v7
        with:
          name: llama-${{ matrix.target }}-${{ matrix.backend }}
          path: dist/Stella-llama-v*-${{ matrix.target }}-${{ matrix.backend }}

  publish:
    if: ${{ inputs.publish }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          PY_VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -n1)
          CLI_VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' cli/Cargo.toml | head -n1)
          test "$VERSION" = "$PY_VERSION"
          test "$VERSION" = "$CLI_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_REF=v$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: llama-*
          path: dist
          merge-multiple: false
      - name: Package and publish verified backend assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          for directory in Stella-llama-v*; do
            [ -d "$directory" ] || continue
            (cd "$directory" && zip -q -r "../${directory}.zip" .)
          done
          assets=(Stella-llama-v*.zip)
          test "${#assets[@]}" -eq 5
          cpu_asset="Stella-llama-v${VERSION}-windows-x86_64-cpu.zip"
          test -f "$cpu_asset"
          python ../scripts/build_release_catalog.py \
            --backend-asset "$cpu_asset" \
            --release-ref "$RELEASE_REF" \
            --repository "${GITHUB_REPOSITORY}" \
            --output package-catalog-windows-amd64.json
          gh release upload "$RELEASE_REF" "${assets[@]}" --clobber
          gh release upload "$RELEASE_REF" package-catalog-windows-amd64.json --clobber
          gh release view "$RELEASE_REF" --json assets --jq '.assets[].name'
