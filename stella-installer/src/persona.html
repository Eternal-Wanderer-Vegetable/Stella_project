<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Stella 人格设定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>人格设定</h1>
      <span class="ver">v2.4.0</span>
      <nav class="top-nav">
        <a class="nav-secondary" href="./run.html">运行状态</a>
        <a class="nav-secondary" href="./config.html">配置</a>
        <a class="nav-secondary" href="./persona.html">人格设定</a>
        <a class="nav-secondary" href="./doctor.html">环境自检</a>
      </nav>
    </header>
    <p class="subtitle">为共享空间编辑 system prompt。未指定自定义人格的空间继续使用 memory/SYSTEM.md。</p>
    <div id="root"><div class="loading">正在读取人格…</div></div>
  </div>

  <script type="module">
    import { getPersonas, savePersona, getVersion, installCloseOverlay } from "./api.js";

    const root = document.getElementById("root");
    installCloseOverlay();
    getVersion().then(v => { document.querySelector(".ver").textContent = `v${v}`; }).catch(() => {});
    let personas = [];
    let selected = 0;

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function render() {
      if (!personas.length) {
        root.innerHTML = `<div class="notice">还没有共享空间。请先在“配置”页面创建空间并分配群号。</div>`;
        return;
      }
      const p = personas[selected];
      root.innerHTML = `
        <div class="persona-editor">
          <aside class="persona-sidebar">
            <div class="persona-sidebar-title">共享空间</div>
            ${personas.map((item, i) => `<button class="persona-item ${i === selected ? "active" : ""}" data-index="${i}">
              <strong>${esc(item.name)}</strong><small>${item.groups.length ? `${item.groups.length} 个群` : "未分配群号"}</small>
            </button>`).join("")}
          </aside>
          <section class="persona-main">
            <div class="persona-toolbar">
              <div><strong>${esc(p.name)}</strong><span class="persona-meta">${p.fallback ? "当前使用默认人格" : esc(p.prompt_file)}</span></div>
              <div class="persona-actions"><input id="prompt-file" value="${esc(p.prompt_file || `${p.name}.md`)}" placeholder="persona.md" /><input type="file" id="persona-file" accept=".txt,.md,text/plain" hidden /><button type="button" id="btn-import">导入纯文本</button><button class="primary" id="btn-save">保存</button></div>
            </div>
            <textarea id="persona-content" class="persona-code" spellcheck="false">${esc(p.content)}</textarea>
            <div class="persona-footer" id="persona-status">${p.fallback ? "编辑后保存即可创建该空间的自定义人格文件。" : "已加载自定义人格。"}</div>
          </section>
        </div>`;
      root.querySelectorAll(".persona-item").forEach(button => button.onclick = () => { selected = Number(button.dataset.index); render(); });
      root.querySelector("#btn-save").onclick = save;
      root.querySelector("#btn-import").onclick = () => root.querySelector("#persona-file").click();
      root.querySelector("#persona-file").onchange = importText;
    }

    async function importText(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const bytes = await file.arrayBuffer();
        const content = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        if (content.includes("\0")) throw new Error("文件包含二进制内容，不是纯文本");
        root.querySelector("#persona-content").value = content;
        if (!root.querySelector("#prompt-file").value.trim()) root.querySelector("#prompt-file").value = file.name.endsWith(".md") ? file.name : `${personas[selected].name}.md`;
        root.querySelector("#persona-status").textContent = "已导入，点击保存后写入当前空间。";
      } catch (e) {
        root.querySelector("#persona-status").textContent = `导入失败：${e}`;
      }
      event.target.value = "";
    }

    async function save() {
      const button = root.querySelector("#btn-save");
      const status = root.querySelector("#persona-status");
      button.disabled = true;
      status.textContent = "正在保存…";
      try {
        const p = personas[selected];
        await savePersona(p.name, root.querySelector("#prompt-file").value.trim(), root.querySelector("#persona-content").value);
        personas = await getPersonas();
        selected = Math.min(selected, personas.length - 1);
        render();
      } catch (e) {
        status.textContent = `保存失败：${e}`;
        button.disabled = false;
      }
    }

    try {
      personas = await getPersonas();
      render();
    } catch (e) {
      root.innerHTML = `<div class="notice notice-error">无法读取人格：<code>${esc(e)}</code></div>`;
    }
  </script>
</body>
</html>
