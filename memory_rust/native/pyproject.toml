[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "stella-memory-rust"
version = "0.1.0"
description = "Optional Rust memory retrieval engine for Stella"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "memory_rust._native"
python-source = "../.."
python-packages = ["memory_rust"]
features = ["pyo3/extension-module"]
exclude = ["memory_rust/native/**"]
