name: Release

# 打 v* tag 触发；也支持手工触发（填版本号即可，不带 v 前缀）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '打包版本号（不带 v 前缀，如 0.3.0），用于手工测试打包流程'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 防止忘改 pyproject.toml 版本号：tag v0.3.0 必须与 version = "0.3.0" 一致
      - name: 校验版本号一致
        run: |
          VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -n1)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG=${GITHUB_REF_NAME#v}
          else
            TAG="${{ inputs.version }}"
            TAG=${TAG#v}
          fi
          echo "pyproject.toml version: ${VERSION}"
          echo "tag（去 v 前缀）: ${TAG}"
          if [ -z "${VERSION}" ]; then
            echo "::error::无法从 pyproject.toml 解析版本号"
            exit 1
          fi
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::pyproject.toml 版本（${VERSION}）与 tag（${TAG}）不一致，请先更新版本号"
            exit 1
          fi
          echo "RELEASE_REF=v${TAG}" >> "$GITHUB_ENV"

      # 不复用 .gitignore：两者语义不同（rsync 的 --exclude-from 不支持 ! 否定模式，
      # 锚定 / 的含义也有差异），且 .gitignore 将来会因开发需要增删——那些改动
      # 不该意外影响 Release 内容。Release 的排除清单必须是明确、独立维护的。
      - name: 构造发布目录（排除测试与开发文件）
        run: |
          mkdir -p dist/Stella
          rsync -a \
            --exclude 'tests' \
            --exclude 'design_docs' \
            --exclude 'scripts' \
            --exclude '_deprecated' \
            --exclude '.github' \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude 'release_assets' \
            --exclude 'memory/benchmark' \
            --exclude 'requirements-dev.txt' \
            --exclude 'pyrightconfig.json' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '.mypy_cache' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.bak' \
            --exclude '.env.dev' \
            --exclude '.env.prod' \
            --exclude 'deploy.answers.toml' \
            --exclude 'logs' \
            --exclude 'runtime' \
            --exclude '*.db' \
            --exclude '*.jsonl' \
            --exclude '*.log' \
            --exclude 'consolidation_probe*' \
            --exclude 'consolidation_positive_probe.md' \
            --exclude 'windows_raw.json' \
            --exclude 'stella_thought_logs.md' \
            --exclude 'memory_consolidation_log.md' \
            --exclude 'memory_compressor_log.md' \
            ./ dist/Stella/
          cp release_assets/start.bat release_assets/doctor.bat \
             release_assets/stop.bat release_assets/README-快速开始.txt dist/Stella/

      # Linux 上打的 zip 若 bat 是 LF，Windows 的 cmd 可能解析异常，必须统一 CRLF
      - name: 确保 bat 与 txt 为 CRLF
        run: |
          sed -i 's/\r$//' dist/Stella/start.bat dist/Stella/doctor.bat \
            dist/Stella/stop.bat dist/Stella/README-快速开始.txt
          sed -i 's/$/\r/' dist/Stella/start.bat dist/Stella/doctor.bat \
            dist/Stella/stop.bat dist/Stella/README-快速开始.txt

      - name: 打包 zip
        run: |
          cd dist
          zip -q -r "Stella-${RELEASE_REF}-win64.zip" Stella
          ls -lh "Stella-${RELEASE_REF}-win64.zip"

      # 纵深防御：排除清单必然会有遗漏（将来加新的配置/日志文件时容易忘），
      # 这一步在发布前对成品做最后检查。含真实群聊内容或凭据的文件一旦发布
      # 就无法收回——GitHub Release 的资产会被立刻镜像与抓取。
      - name: 校验 zip 未包含敏感文件
        run: |
          ZIP="dist/Stella-${RELEASE_REF}-win64.zip"
          echo "=== 发布包内容 ==="
          unzip -l "$ZIP"
          echo "=================="
          # 注意不能裸匹配 probe / consolidation_log：deploy/probe.py 与
          # memory/consolidation_log.py 是必需模块，会正常出现在包内；
          # .env.example 也需保留（deploy init 的模板），因此 .env 只匹配
          # 带敏感后缀的变体（.dev/.prod/.bak/.backup）与根目录 .env。
          if unzip -l "$ZIP" | grep -Ei '(/\.env(\.(dev|prod|bak|backup))?$|answers\.toml|\.db$|\.jsonl$|\.log$|stella_thought_logs|memory_consolidation_log|memory_compressor_log|windows_raw|_probe|sanitize_map)'; then
            echo "::error::发布包含敏感或运行期文件，已中止发布"
            exit 1
          fi
          if unzip -l "$ZIP" | grep -E '(tests/|design_docs/|_deprecated/)'; then
            echo "::error::发布包含开发目录，已中止发布"
            exit 1
          fi
          echo "✅ 敏感文件检查通过"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_REF}" \
            "dist/Stella-${RELEASE_REF}-win64.zip" \
            --title "Stella ${RELEASE_REF}" \
            --notes-file release_assets/RELEASE_NOTES_TEMPLATE.md
