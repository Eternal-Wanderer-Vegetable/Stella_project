<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Stella</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>配置</h1>
      <span class="ver">v2.6.0</span>
      <nav class="top-nav">
        <a class="nav-secondary" href="./run.html">运行状态</a>
        <a class="nav-secondary" href="./usage.html">用量</a>
        <a class="nav-secondary" href="./plugins.html">插件</a>
        <a class="nav-secondary" href="./config.html">配置</a>
        <a class="nav-secondary" href="./persona.html">人格设定</a>
        <a class="nav-secondary" href="./doctor.html">环境自检</a>
      </nav>
    </header>
    <p class="subtitle">填写启动 Stella 所需的连接和模型信息。配置会写入项目根目录的 .env。</p>
    <div id="root"><div class="loading">正在读取配置…</div></div>
  </div>

  <script type="module">
    import { getConfig, saveConfig, listModels, runDoctor, getVersion, installCloseOverlay } from "./api.js";

    const root = document.getElementById("root");
    installCloseOverlay();
    getVersion().then(v => { document.querySelector(".ver").textContent = `v${v}`; }).catch(() => {});
    let config = null;
    let schemaFields = [];
    let advancedValues = {};
    let mainValues = {};
    const ROLE_NAMES = ["CHAT", "ROUTER", "PLUGIN", "COMPACT", "CONSOLIDATION", "EXTRACT"];
    const SLOT_NAMES = ["LOCAL", "ONLINE_CHAT", "ONLINE_MEMORY", "EXTRA"];
    // 主表单与「模型服务」分区管的键不能再出现在「高级配置」里：同一个键摆两个控件，
    // 用户改了其中一个、保存时另一个的旧值又盖回去，表现就是「改了没反应」。
    // 刻意**不**列入 LLM_ENDPOINT_LOCAL_BASE_URL / _API_KEY / _MODEL 与
    // LLM_ENDPOINT_EXTRA_MODEL：本机与备用两张卡的地址、key、模型用的是旧键
    // （LM_STUDIO_* / CONSOLIDATION_LM_STUDIO_MODEL），端点级同名键是「留空即继承」的
    // 覆盖项，留在高级配置里当逃生口（真要指到另一台机器、或让整张卡换个模型时才用）。
    // 六个 LLM_ROLE_*_MODEL 同理降级：模型的正常出处是端点卡片，角色级只是
    // 「同一端点上某个角色换个模型」的覆盖项，卡片上不再给它控件。
    // 四个 LLM_ENDPOINT_*_KIND 留在 managed 里但也没有控件：值由 slotKind() 按槽名
    // 与地址推导、syncKinds() 写回。放进高级配置只会让人以为改了有用——保存时推导
    // 值一定盖回去。
    const managedKeys = new Set([
      "ALLOWED_GROUPS", "HOST", "PORT", "ONEBOT_WS_URLS", "ONEBOT_ACCESS_TOKEN",
      "LM_STUDIO_BASE_URL", "LM_STUDIO_MODEL", "CONSOLIDATION_LM_STUDIO_MODEL",
      "MEMORY_EMBEDDING_MODEL",
      "LM_STUDIO_API_KEY", "MEMORY_EMBEDDING_GATE", "LLM_FALLBACK_ENABLED",
      ...SLOT_NAMES.flatMap(slot => ["KIND", "CONCURRENCY", "TIMEOUT"].map(f => `LLM_ENDPOINT_${slot}_${f}`)),
      ...SLOT_NAMES.filter(slot => slot !== "LOCAL")
        .flatMap(slot => [`LLM_ENDPOINT_${slot}_BASE_URL`, `LLM_ENDPOINT_${slot}_API_KEY`]),
      "LLM_ENDPOINT_ONLINE_CHAT_MODEL", "LLM_ENDPOINT_ONLINE_MEMORY_MODEL",
      ...ROLE_NAMES.flatMap(role =>
        ["ENDPOINT", "TEMPERATURE", "MAX_TOKENS", "FALLBACK_ENDPOINT"]
          .map(f => `LLM_ROLE_${role}_${f}`)),
    ]);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      root.innerHTML = `
        <div class="config-card">
          <h2>Stella 配置</h2>
          <p class="config-help">群号必填。地址与模型 ID 都在下面「模型服务」的端点卡片里填 —— 一个端点一张卡，卡上填一次，指到它的角色就都用这个模型（纯在线部署本机那张卡可以留空）。模型列表可点卡片上的「测试连接」自动读取，也可以手工输入。</p>
          <form id="config-form">
            <div class="config-grid">
              <div class="config-field">
                <label for="onebot_mode">OneBot 连接方式</label>
                <select id="onebot_mode">
                  <option value="reverse" ${config.onebot_mode === "reverse" ? "selected" : ""}>反向 WS：Stella 监听端口</option>
                  <option value="forward" ${config.onebot_mode === "forward" ? "selected" : ""}>正向 WS：连接 NapCat 服务端</option>
                </select>
              </div>
              <div class="config-field">
                <label for="access_token">OneBot access token（可留空）</label>
                <input id="access_token" type="password" value="${esc(config.access_token)}" />
              </div>
              <div class="config-field reverse-only">
                <label for="host">监听地址</label>
                <input id="host" value="${esc(config.host)}" />
              </div>
              <div class="config-field reverse-only">
                <label for="port">监听端口</label>
                <input id="port" type="number" min="1" max="65535" value="${esc(config.port)}" />
              </div>
              <div class="config-field full forward-only">
                <label for="ws_urls">NapCat WS 服务端地址（逗号分隔）</label>
                <textarea id="ws_urls" placeholder="ws://127.0.0.1:3001">${esc(config.ws_urls)}</textarea>
              </div>
              <div class="config-field full">
                <label>共享空间</label>
                <div class="space-head" id="space-head" hidden>
                  <span>空间名</span><span>system prompt 文件</span><span>具体群号（逗号分隔）</span><span></span>
                </div>
                <div id="space-rows"></div>
                <button type="button" id="btn-add-space">+ 创建共享空间</button>
                <span class="config-status">每个空间包含：空间名 → system prompt 文件 → 具体群号。同一空间共享长期记忆和人格。</span>
              </div>
              <datalist id="model-list"></datalist>
            </div>
            <section class="svc" id="model-service"></section>
            <div id="primary-groups"></div>
            <div class="config-actions">
              <button type="submit" class="primary" id="btn-save">保存并检查</button>
              <button type="button" id="btn-models">读取 LM Studio 模型</button>
              <span class="config-status" id="status"></span>
            </div>
            <div class="config-error" id="error"></div>
            <details class="config-advanced">
              <summary>高级配置（settings.py 中的全部运行参数）</summary>
              <p class="config-help">默认折叠。这里对应项目的完整 .env 模板，适合熟悉 Stella 参数的用户编辑。基础配置项以页面上方表单为准。</p>
              <button type="button" id="btn-reset-defaults">重置高级配置为默认值</button>
              <div id="advanced-groups"></div>
            </details>
          </form>
        </div>
        <div class="card">
          <label>从旧版本导入配置</label>
          <span class="config-status" id="migrate-hint">
            有 3.0.0 或更早的安装？可以把配置、记忆、人格和插件数据一次性搬过来。
            全程只读旧目录，导入前会自动备份数据库。
          </span>
          <div class="config-actions">
            <button type="button" id="btn-migrate">打开配置导入</button>
          </div>
        </div>`;

      const mode = root.querySelector("#onebot_mode");
      const updateMode = () => {
        root.querySelectorAll(".reverse-only").forEach(e => e.style.display = mode.value === "reverse" ? "" : "none");
        root.querySelectorAll(".forward-only").forEach(e => e.style.display = mode.value === "forward" ? "" : "none");
      };
      mode.onchange = updateMode;
      updateMode();
      renderSpaceRows();
      schemaFields = config.schema?.fields || [];
      advancedValues = { ...(config.advanced_values || {}) };
      // 这四个键的控件长在「模型服务」的卡片里，而那一片会被 renderModelService()
      // 整段重绘（换预设、重置默认值时）。重绘会把 DOM 连根换掉，所以值另存一份，
      // 否则用户刚打的地址会在点一下预设之后消失。
      mainValues = {
        lm_base_url: String(config.lm_base_url ?? ""),
        chat_model: String(config.chat_model ?? ""),
        consolidation_model: String(config.consolidation_model ?? ""),
        embedding_model: String(config.embedding_model ?? ""),
      };
      renderAdvanced();
      renderModelService();
      root.querySelector("#btn-add-space").onclick = () => addSpaceRow();
      root.querySelector("#btn-models").onclick = loadModels;
      root.querySelector("#btn-reset-defaults").onclick = resetDefaults;
      // 导入是一次性动作，所以不放顶栏，而是挂在配置页表单**下方**：新用户的主线是
      // 填配置，存量用户才需要导入。未配置且探测到旧安装时，index.html 会直接把人
      // 送进导入页，那条路径不受这里影响。
      root.querySelector("#btn-migrate").onclick = () => { location.href = "./migrate.html"; };
      root.querySelector("#config-form").onsubmit = save;
    }

    function collect() {
      const value = id => root.querySelector(`#${id}`).value.trim();
      return {
        allowed_groups: "",
        onebot_mode: value("onebot_mode"),
        host: value("host"),
        port: Number(value("port")),
        ws_urls: value("ws_urls"),
        access_token: value("access_token"),
        // 这四个的控件在端点卡片里（id 保持不变：Rust 侧的 managed 强写清单按 id 取值）
        lm_base_url: mainValue("lm_base_url"),
        chat_model: mainValue("chat_model"),
        consolidation_model: mainValue("consolidation_model"),
        embedding_model: mainValue("embedding_model"),
        spaces: [...root.querySelectorAll(".space-row")].map(row => {
          const fields = row.querySelectorAll("input");
          return `${fields[0].value.trim()} | ${fields[1].value.trim()} | ${fields[2].value.trim()}`;
        }).filter(line => line.replace(/[|\s]/g, "").length > 0).join("\n"),
        advanced_env: buildAdvancedEnv(),
      };
    }

    function parseSpaces(raw) {
      return raw.split("\n").map(line => line.trim()).filter(Boolean).map(line => {
        if (line.includes("|")) {
          const parts = line.split("|").map(v => v.trim());
          return [parts[0] || "", parts[1] || "", parts[2] || ""];
        }
        const [name, groups = ""] = line.split(":");
        return [name.trim(), "", groups.trim()];
      });
    }

    function renderSpaceRows() {
      const rows = root.querySelector("#space-rows");
      rows.innerHTML = "";
      parseSpaces(config.spaces || "").forEach(values => addSpaceRow(values));
      syncSpaceHead();
    }

    /** 列名只在有行的时候显示：三个输入框填上值之后 placeholder 就看不见了，
     *  光凭「三个一样宽的框」没人分得清哪个是空间名、哪个是群号。 */
    function syncSpaceHead() {
      const head = root.querySelector("#space-head");
      if (head) head.hidden = !root.querySelector("#space-rows").children.length;
    }

    function addSpaceRow(values = ["", "", ""]) {
      const row = document.createElement("div");
      row.className = "space-row";
      row.innerHTML = `<input placeholder="空间名" value="${esc(values[0])}" /><input placeholder="prompt.md" value="${esc(values[1])}" /><input placeholder="群号，逗号分隔" value="${esc(values[2])}" /><button type="button" class="space-remove">删除</button>`;
      row.querySelector(".space-remove").onclick = () => { row.remove(); syncSpaceHead(); };
      root.querySelector("#space-rows").appendChild(row);
      syncSpaceHead();
    }

    // ── 模型服务：端点 × 角色 ──
    //
    // 本分区的控件，除了卡片里那四个主表单键（#lm_base_url / #chat_model /
    // #consolidation_model / #embedding_model，Rust 侧按 id 取值）之外都带
    // data-adv-key，因此走的是「高级配置」那条既有链路：
    // buildAdvancedEnv() 收集 → advanced_env 文本 → Rust apply_advanced_env 落盘。
    // 复用而不另开一条的关键理由：「继承型字段留空就不写入 .env」这条规则只写在
    // buildAdvancedEnv 一处，而角色模型（LLM_ROLE_*_MODEL）留空必须继续继承本机
    // 模型 ID —— 写成 `KEY=` 会把继承链静默切断（2026-08-28 那个 bug 的根因）。

    const SLOT_LABEL = {
      LOCAL: "本机 LM Studio",
      ONLINE_CHAT: "在线 · 对话生成",
      ONLINE_MEMORY: "在线 · 记忆整合",
      EXTRA: "备用 / 第二个本机实例",
    };
    const SLOT_NOTE = {
      LOCAL: "本机 LM Studio 的地址与模型 ID 就填在这张卡上（对应 LM_STUDIO_BASE_URL / LM_STUDIO_MODEL）。指到这张卡的角色默认都用这个模型；纯在线部署可以整张卡留空。",
      ONLINE_CHAT: "对话生成专用 key。必须与「在线 · 记忆整合」用不同的一把：两边的提示词前缀分属不同缓存域，共用一把 key 会互相打断缓存，省钱的前提就没了。",
      ONLINE_MEMORY: "记忆整合与会话压缩专用 key。请知悉：整合会把群聊原文发送到这家服务商。",
      EXTRA: "地址留空即沿用 CONSOLIDATION_LM_STUDIO_BASE_URL（它再继承本机地址）。纯本地场景下它与本机同址，作用只是让整合有独立的并发闸门。模型对应 CONSOLIDATION_LM_STUDIO_MODEL。把地址改指服务商，这张卡就自动按在线处理（卡头的类型徽标会跟着变）。",
    };
    const ROLES = [
      { role: "CHAT", label: "对话生成", help: "回复群友的主模型，质量优先。" },
      { role: "ROUTER", label: "兜底判定", help: "判断「这条要不要回」。二分类任务，廉价模型足够。" },
      { role: "PLUGIN", label: "插件调用", help: "第三方插件借用的 LLM。插件代码拿不到这里的 key。" },
      { role: "COMPACT", label: "会话压缩", help: "把较早的对话压成回顾。默认归记忆域，与整合共用缓存以省钱。" },
      { role: "CONSOLIDATION", label: "记忆整合", help: "阶段 1 总结。量大而低频，廉价模型足够。" },
      { role: "EXTRACT", label: "记忆提取", help: "阶段 2 高精度抽取。频次低，值得用强模型。" },
    ];
    // 三个预设只动「角色 → 端点」这一列：地址与 key 是用户填进去的，预设不该清掉，
    // 否则点一下预设就把 key 弄丢了。MEMORY_EMBEDDING_GATE 在三个场景里都是 auto
    // （auto 自己会解析成「共用本地槽闸门」或「不排队」），所以也不在预设范围内。
    const PRESETS = {
      local: { name: "纯本地", map: { CHAT: "LOCAL", ROUTER: "LOCAL", PLUGIN: "LOCAL", COMPACT: "LOCAL", CONSOLIDATION: "EXTRA", EXTRACT: "LOCAL" } },
      online: { name: "纯在线（双 key）", map: { CHAT: "ONLINE_CHAT", ROUTER: "ONLINE_CHAT", PLUGIN: "ONLINE_CHAT", COMPACT: "ONLINE_MEMORY", CONSOLIDATION: "ONLINE_MEMORY", EXTRACT: "ONLINE_MEMORY" } },
      mixed: { name: "混合（对话在线 · 整合本地）", map: { CHAT: "ONLINE_CHAT", ROUTER: "ONLINE_CHAT", PLUGIN: "ONLINE_CHAT", COMPACT: "LOCAL", CONSOLIDATION: "LOCAL", EXTRACT: "LOCAL" } },
    };

    function fieldMeta(key) { return schemaFields.find(field => field.key === key) || {}; }
    function advValue(key) { return String(advancedValues[key] ?? fieldMeta(key).default ?? ""); }
    function advPlaceholder(key) {
      const meta = fieldMeta(key);
      return meta.inherits ? `继承 ${meta.inherits}` : String(meta.default ?? "");
    }
    function urlKeyOf(slot) { return slot === "LOCAL" ? "LM_STUDIO_BASE_URL" : `LLM_ENDPOINT_${slot}_BASE_URL`; }
    function apiKeyOf(slot) { return slot === "LOCAL" ? "LM_STUDIO_API_KEY" : `LLM_ENDPOINT_${slot}_API_KEY`; }

    // 主表单那四个键的控件长在卡片里。id 不能改：Rust 侧的 managed 强写清单按
    // 这几个 id 从表单取值，改名就是「保存了但 .env 没变」。
    const MAIN_IDS = ["lm_base_url", "chat_model", "consolidation_model", "embedding_model"];
    // 哪张卡的「模型」框用的是主表单的旧键（而不是端点级的 LLM_ENDPOINT_<槽>_MODEL）。
    // 与 registry 的 _LEGACY_MODEL_HOME_SLOT 是同一张表，反过来写。
    const CARD_MODEL_MAIN_ID = { LOCAL: "chat_model", EXTRA: "consolidation_model" };

    function syncMain() {
      for (const id of MAIN_IDS) {
        const el = root.querySelector(`#${id}`);
        if (el) mainValues[id] = el.value;
      }
    }
    /** 主表单键的当前值。控件还没建好（首次 render）或刚被重绘掉时读值仓。 */
    function mainValue(id) {
      const el = root.querySelector(`#${id}`);
      return String(el ? el.value : (mainValues[id] ?? "")).trim();
    }

    /** 端点真正会用到的地址：把 settings.py 里那条继承链走完，与运行时一致。 */
    function effectiveUrl(slot) {
      if (slot === "LOCAL") return advValue("LLM_ENDPOINT_LOCAL_BASE_URL").trim() || mainValue("lm_base_url");
      if (slot === "EXTRA") {
        return advValue("LLM_ENDPOINT_EXTRA_BASE_URL").trim()
          || advValue("CONSOLIDATION_LM_STUDIO_BASE_URL").trim()
          || mainValue("lm_base_url");
      }
      return advValue(urlKeyOf(slot)).trim();
    }
    /** 同上，但取 key。只在「测试连接」的请求头里用掉，不显示、不落别处。 */
    function effectiveApiKey(slot) {
      if (slot === "LOCAL") return advValue("LLM_ENDPOINT_LOCAL_API_KEY").trim() || advValue("LM_STUDIO_API_KEY").trim();
      if (slot === "EXTRA") return advValue("LLM_ENDPOINT_EXTRA_API_KEY").trim() || advValue("CONSOLIDATION_LM_STUDIO_API_KEY").trim();
      return advValue(apiKeyOf(slot)).trim();
    }
    // 类型（KIND）不再是卡片上的控件：四个槽的类型本来就能算出来，让人再选一遍
    // 只会选错——把在线卡选成 local 就绕过了「在线端点必须有 key」这条拦截。
    //   · 两个 ONLINE_* 槽固定 online：槽名就是声明。这两个槽**不能**按地址猜，
    //     否则会误判本机中转网关（one-api 这类跑在 127.0.0.1、却按上游厂商计费的
    //     转发层）——那种部署地址是本机的，钱却是真花。
    //   · 本机与备用两张卡按**地址**判断（这两张卡的地址用户是可以改指的）。
    //     不按「有没有 api_key」判断：本机网关要求 dummy key 的人会被误判成在线，
    //     从而漏发 reasoning_effort=none（本地推理模型把 token 全耗在思维链上）。
    const FIXED_SLOT_KIND = { ONLINE_CHAT: "online", ONLINE_MEMORY: "online" };
    /** 地址是否指向本机/局域网。空地址算本机：LOCAL / EXTRA 留空就是继承本机地址。 */
    function looksLocalUrl(url) {
      const host = (/^[a-z][a-z0-9+.-]*:\/\/([^/:?#]+)/i.exec(String(url).trim()) || [])[1] || "";
      if (!host) return true;
      if (/^(localhost|127\.|0\.0\.0\.0$|\[?::1\]?$|host\.docker\.internal$)/i.test(host)) return true;
      if (/^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(host)) return true;
      return !host.includes(".");  // 裸主机名 = 同网段的另一台机器
    }
    function slotKind(slot) {
      return FIXED_SLOT_KIND[slot] || (looksLocalUrl(effectiveUrl(slot)) ? "local" : "online");
    }
    /** 类型没有控件了，所以保存前得由界面把推导结果写回值仓：buildAdvancedEnv() 对
     *  schema 里的每个键都会落一行，不写就会落成 settings.py 里的默认值（EXTRA 的
     *  默认是 local，那么把它指向服务商之后仍然会被当本机，在线的校验全部失效）。 */
    function syncKinds() {
      for (const slot of SLOT_NAMES) advancedValues[`LLM_ENDPOINT_${slot}_KIND`] = slotKind(slot);
    }
    const KIND_BADGE = {
      local: { text: "本机 · 不计费", cls: "svc-kind-local" },
      online: { text: "在线 · 按量计费", cls: "svc-kind-online" },
    };
    /** 卡片头上的类型徽标，只读。备用/本机卡会随地址变，所以要能原地重画。 */
    function kindBadgeHTML(slot) {
      const badge = KIND_BADGE[slotKind(slot)] || KIND_BADGE.local;
      const title = FIXED_SLOT_KIND[slot]
        ? "在线槽，类型固定" : "按地址判断：本机/局域网地址算本机，其他算在线服务商";
      return `<span class="svc-kind ${badge.cls}" data-slot-kind="${esc(slot)}" title="${esc(title)}">${esc(badge.text)}</span>`;
    }
    function refreshKindBadges() {
      const host = root.querySelector("#model-service");
      if (!host) return;
      for (const slot of SLOT_NAMES) {
        const badge = host.querySelector(`[data-slot-kind="${slot}"]`);
        if (badge) badge.outerHTML = kindBadgeHTML(slot);
      }
    }
    function roleSlot(role) {
      const raw = advValue(`LLM_ROLE_${role}_ENDPOINT`).trim();
      return raw || (role === "CONSOLIDATION" ? "EXTRA" : "LOCAL");
    }

    // ── 模型 ID 的三档解析（必须与 core/llm/registry.py 的 _resolve_role_model 一致）──
    //
    // 顺序：角色显式 MODEL → 该角色所绑端点的 MODEL → 角色自己的旧键。
    // 界面这边算一遍，只为了在角色行里显示「这个角色最终会用哪个模型、来自哪里」——
    // 角色行不再放模型输入框（模型在端点卡片上填一次就够），但用户仍要能看见结果。
    const ROLE_MODEL_LEGACY_KEY = {
      CHAT: "LM_STUDIO_MODEL",
      ROUTER: "LM_STUDIO_MODEL",
      PLUGIN: "ASTRBOT_LLM_MODEL",
      COMPACT: "LM_STUDIO_MODEL",
      CONSOLIDATION: "CONSOLIDATION_LM_STUDIO_MODEL",
      EXTRACT: "MEMORY_EXTRACT_LM_STUDIO_MODEL",
    };
    const LEGACY_MODEL_HOME_SLOT = {
      LM_STUDIO_MODEL: "LOCAL",
      ASTRBOT_LLM_MODEL: "LOCAL",
      MEMORY_EXTRACT_LM_STUDIO_MODEL: "LOCAL",
      CONSOLIDATION_LM_STUDIO_MODEL: "EXTRA",
    };

    /** 旧键的实际值。两个直接键的控件在卡片上；另两个是继承型，留空即继承 LM_STUDIO_MODEL。 */
    function legacyModelValue(key) {
      if (key === "LM_STUDIO_MODEL") return mainValue("chat_model");
      if (key === "CONSOLIDATION_LM_STUDIO_MODEL") return mainValue("consolidation_model");
      return advValue(key).trim() || mainValue("chat_model");
    }

    /** 端点级模型（第二档）。LOCAL / EXTRA 这两张卡上填的是旧键，端点级键是逃生口。 */
    function endpointModel(slot) { return advValue(`LLM_ENDPOINT_${slot}_MODEL`).trim(); }

    /** 角色最终用的模型 + 出处（出处只给人看，出错时能一眼知道该去改哪个框）。 */
    function effectiveModel(role) {
      const legacyKey = ROLE_MODEL_LEGACY_KEY[role] || "";
      const legacy = legacyKey ? legacyModelValue(legacyKey) : "";
      const explicit = advValue(`LLM_ROLE_${role}_MODEL`).trim();
      // 「显式」的判据与后端一致：值与它继承的旧键不同才算用户单独指定过。
      if (explicit && explicit !== legacy) return { model: explicit, from: `角色覆盖 LLM_ROLE_${role}_MODEL` };
      const slot = roleSlot(role);
      const slotModel = endpointModel(slot);
      if (slotModel) return { model: slotModel, from: `端点 ${slot} 的 MODEL` };
      // 旧键垫底，但在线槽上只认「这张卡自己的那个旧键」：别的旧键装的是本机模型名，
      // 发给在线服务商一律 400，不如在这里就显示成「未指定」。
      if (slotKind(slot) !== "online" || slot === LEGACY_MODEL_HOME_SLOT[legacyKey]) {
        return { model: legacy, from: legacy ? `端点 ${slot} 的模型（${legacyKey}）` : "" };
      }
      return { model: "", from: "" };
    }

    /** 槽名下拉。.env 里若写着未知槽名，作为一个显式选项保留——静默改成 LOCAL
     *  等于替用户改配置，而 registry.validate() 本来就会把非法槽名报成 error。 */
    function slotOptions(current, blankLabel = "") {
      const names = SLOT_NAMES.includes(current) || !current ? SLOT_NAMES : [...SLOT_NAMES, current];
      const head = blankLabel ? `<option value="" ${current ? "" : "selected"}>${esc(blankLabel)}</option>` : "";
      return head + names.map(slot => {
        const label = SLOT_LABEL[slot] ? `${slot} · ${SLOT_LABEL[slot]}` : `${slot}（未知槽名）`;
        return `<option value="${esc(slot)}" ${slot === current ? "selected" : ""}>${esc(label)}</option>`;
      }).join("");
    }

    function endpointCardHTML(slot) {
      const urlKey = urlKeyOf(slot);
      const keyKey = apiKeyOf(slot);
      const isLocal = slot === "LOCAL";
      // 逃生口被用上时要显式说出来，否则卡片显示的值和运行时用的值不一致。
      const tags = [];
      const urlOverride = isLocal ? advValue("LLM_ENDPOINT_LOCAL_BASE_URL").trim() : "";
      if (urlOverride) tags.push(`地址已被高级配置 LLM_ENDPOINT_LOCAL_BASE_URL 覆盖到 ${urlOverride}`);
      const mainModelId = CARD_MODEL_MAIN_ID[slot] || "";
      const modelOverride = mainModelId ? endpointModel(slot) : "";
      if (modelOverride) tags.push(`模型已被高级配置 LLM_ENDPOINT_${slot}_MODEL 覆盖到 ${modelOverride}`);
      // LOCAL 的地址控件就是原来基础配置里的那一个（#lm_base_url 搬进卡片，id 不变）。
      const urlField = isLocal
        ? `<input id="lm_base_url" value="${esc(mainValue("lm_base_url"))}" placeholder="http://127.0.0.1:1234" />`
        : `<input data-adv-key="${esc(urlKey)}" data-svc-url="${esc(slot)}" value="${esc(advValue(urlKey))}"
                 placeholder="${esc(advPlaceholder(urlKey) || "https://api.example.com（填服务根地址，不要带 /v1）")}" />`;
      // 模型同理：LOCAL / EXTRA 用主表单的旧键（#chat_model / #consolidation_model），
      // 两个在线槽用端点级键。候选列表各指自己卡片「测试连接」拉回来的那份。
      const modelField = mainModelId
        ? `<input id="${esc(mainModelId)}" list="model-list" value="${esc(mainValue(mainModelId))}"
                 placeholder="${esc(mainModelId === "chat_model" ? "例如 google/gemma-3-27b（留空则由本机服务端默认路由）" : "例如 google/gemma-3-4b")}" />`
        : `<input data-adv-key="LLM_ENDPOINT_${esc(slot)}_MODEL" list="svc-models-${esc(slot)}"
                 value="${esc(endpointModel(slot))}" placeholder="服务商文档里的模型 ID，例如 deepseek-chat" />`;
      return `
        <div class="svc-card" data-slot="${esc(slot)}">
          <div class="svc-card-head">
            <b>${esc(SLOT_LABEL[slot])}</b><code>${esc(slot)}</code>
            ${kindBadgeHTML(slot)}
            ${tags.map(text => `<span class="svc-tag">${esc(text)}</span>`).join("")}
          </div>
          <span class="svc-note">${esc(SLOT_NOTE[slot])}</span>
          <div class="svc-card-grid">
            <label class="svc-f-url">地址${urlField}</label>
            <label class="svc-f-model">模型 ID${modelField}</label>
            <label class="svc-f-key">API key
              <input type="password" data-adv-key="${esc(keyKey)}" data-svc-key="${esc(slot)}"
                     value="${esc(advValue(keyKey))}"
                     placeholder="${esc(advPlaceholder(keyKey) || (isLocal ? "本机一般不校验，可留空" : "在线端点必填"))}" />
            </label>
            <label class="svc-f-num">并发度
              <input inputmode="numeric" data-adv-key="LLM_ENDPOINT_${esc(slot)}_CONCURRENCY"
                     value="${esc(advValue(`LLM_ENDPOINT_${slot}_CONCURRENCY`))}" />
            </label>
            <label class="svc-f-num">超时（秒）
              <input inputmode="numeric" data-adv-key="LLM_ENDPOINT_${esc(slot)}_TIMEOUT"
                     value="${esc(advValue(`LLM_ENDPOINT_${slot}_TIMEOUT`))}" />
            </label>
          </div>
          <div class="svc-card-foot">
            <button type="button" data-svc-test="${esc(slot)}">测试连接</button>
            <span class="config-status" data-svc-status="${esc(slot)}"></span>
          </div>
          <datalist id="svc-models-${esc(slot)}"></datalist>
        </div>`;
    }

    /** 角色行的「模型」列：只读显示，不给输入框。
     *
     *  模型在端点卡片上填一次就够了（一个端点通常只对应一家服务商的一份模型清单），
     *  在六个角色上再各写一遍同一个字符串，除了让人漏改其中一行没有别的作用。
     *  真要让某个角色在同一端点上换模型，改高级配置里的 LLM_ROLE_<角色>_MODEL —— 那时
     *  这里会显示成「角色覆盖」，不至于让人以为界面没生效。
     */
    function roleModelCellHTML(role) {
      const { model, from } = effectiveModel(role);
      if (model) {
        return `<span class="svc-model" data-role-model="${esc(role)}">${esc(model)}<small>${esc(from)}</small></span>`;
      }
      const hint = slotKind(roleSlot(role)) === "online"
        ? "未指定 —— 在端点卡片的「模型 ID」里填"
        : "留空：由本机服务端默认路由";
      return `<span class="svc-model svc-model-empty" data-role-model="${esc(role)}"><i>${esc(hint)}</i></span>`;
    }

    // 数值列刻意用 text + inputmode 而非 type="number"：number 控件读到 .env 里
    // 已有的非法值会把 value 变成空串，syncAdvanced 一收就静默清空了用户配置。
    function roleRowHTML(entry) {
      const key = suffix => `LLM_ROLE_${entry.role}_${suffix}`;
      const slot = roleSlot(entry.role);
      const num = suffix => `<input inputmode="decimal" data-adv-key="${esc(key(suffix))}"
             value="${esc(advValue(key(suffix)))}" placeholder="${esc(advPlaceholder(key(suffix)))}" />`;
      return `
        <div class="svc-row" data-role="${esc(entry.role)}">
          <span class="svc-role"><b>${esc(entry.label)}</b><small>${esc(entry.help)}</small></span>
          <select data-adv-key="${esc(key("ENDPOINT"))}" data-role-endpoint="${esc(entry.role)}">${slotOptions(slot)}</select>
          ${roleModelCellHTML(entry.role)}
          ${num("TEMPERATURE")}
          ${num("MAX_TOKENS")}
          <select data-adv-key="${esc(key("FALLBACK_ENDPOINT"))}">${slotOptions(advValue(key("FALLBACK_ENDPOINT")).trim(), "不回退")}</select>
        </div>`;
    }

    /** Embedding 行：端点列固定灰显。向量维度随模型变，换一次整库都要重算，
     *  所以它**不随 LLM 一起切到在线**（方案 §11.3 R2）。 */
    function embeddingRowHTML() {
      return `
        <div class="svc-row svc-row-embed">
          <span class="svc-role"><b>语义检索 embedding</b><small>换模型等于换向量维度，整库都要重算，所以不随 LLM 切换。</small></span>
          <span class="svc-fixed" title="本地专用，不随 LLM 切换">本机（固定）</span>
          <input id="embedding_model" list="model-list" value="${esc(mainValue("embedding_model"))}"
                 placeholder="例如 text-embedding-model" />
          <span class="svc-fixed">—</span>
          <span class="svc-fixed">—</span>
          <span class="svc-fixed">—</span>
        </div>`;
    }

    function renderModelService() {
      const host = root.querySelector("#model-service");
      syncMain();  // 卡片里那四个真控件即将被重绘掉，先把值收进值仓
      const gate = advValue("MEMORY_EMBEDDING_GATE").trim() || "auto";
      const gateOptions = ["auto", "none", ...SLOT_NAMES];
      const fallback = advValue("LLM_FALLBACK_ENABLED").trim().toLowerCase() !== "false";
      host.innerHTML = `
        <div class="svc-head">
          <h3>模型服务</h3>
          <span class="config-status">先在端点卡片里填地址、模型和 key，再把 6 个角色分别指到端点 —— 模型跟着端点走，角色行只显示结果。改完点下面的「保存并检查」。</span>
        </div>
        <div class="svc-presets">
          <span>一键预设：</span>
          ${Object.entries(PRESETS).map(([id, preset]) =>
            `<button type="button" data-svc-preset="${esc(id)}">${esc(preset.name)}</button>`).join("")}
          <span class="config-status" id="svc-preset-status">预设只改「角色 → 端点」，不会动你填的地址和 key。</span>
        </div>
        <div class="svc-cards">${SLOT_NAMES.map(endpointCardHTML).join("")}</div>
        <div class="svc-matrix">
          <div class="svc-row svc-row-head">
            <span>角色</span><span>端点</span><span>模型</span><span>温度</span><span>max_tokens</span><span>失败回退</span>
          </div>
          ${ROLES.map(roleRowHTML).join("")}
          ${embeddingRowHTML()}
        </div>
        <div class="svc-foot">
          <label>端点失败时回退
            <select data-adv-key="LLM_FALLBACK_ENABLED">
              <option value="true" ${fallback ? "selected" : ""}>开启</option>
              <option value="false" ${fallback ? "" : "selected"}>关闭</option>
            </select>
          </label>
          <label>embedding 排队闸门
            <select data-adv-key="MEMORY_EMBEDDING_GATE">
              ${gateOptions.map(v => `<option value="${esc(v)}" ${v === gate ? "selected" : ""}>${esc(v)}</option>`).join("")}
            </select>
          </label>
          <span class="config-status">回退只在角色选了「失败回退」端点时才生效；冷却时间见高级配置 LLM_FALLBACK_COOLDOWN。</span>
        </div>
        <div class="svc-warn" id="svc-warn"></div>`;

      host.querySelectorAll("[data-svc-preset]").forEach(button => {
        button.onclick = () => applyPreset(button.dataset.svcPreset);
      });
      host.querySelectorAll("[data-svc-test]").forEach(button => {
        button.onclick = () => testEndpoint(button.dataset.svcTest);
      });
      // 角色换端点 → 模型列跟着变（换端点就是换模型，这是本次改动的核心语义）。
      host.querySelectorAll("[data-role-endpoint]").forEach(select => {
        select.onchange = refreshServiceWarnings;
      });
      host.querySelectorAll("[data-adv-key]").forEach(input => {
        input.addEventListener("change", refreshServiceWarnings);
      });
      // 卡片里那四个主表单控件不带 data-adv-key（它们由 collect() 直接按 id 取），
      // 但角色行的模型列是从它们算出来的，所以边打字边刷新。
      for (const id of MAIN_IDS) {
        host.querySelector(`#${id}`)?.addEventListener("input", refreshServiceWarnings);
      }
      refreshServiceWarnings();
    }

    function applyPreset(id) {
      const preset = PRESETS[id];
      if (!preset) return;
      syncAdvanced();  // 先收编辑中的值，否则重绘会把用户刚打的字冲掉
      for (const [role, slot] of Object.entries(preset.map)) advancedValues[`LLM_ROLE_${role}_ENDPOINT`] = slot;
      renderModelService();
      root.querySelector("#svc-preset-status").textContent = `已套用「${preset.name}」，点保存后生效。`;
    }

    async function testEndpoint(slot) {
      const host = root.querySelector("#model-service");
      const button = host.querySelector(`[data-svc-test="${slot}"]`);
      const status = host.querySelector(`[data-svc-status="${slot}"]`);
      syncAdvanced();
      const url = effectiveUrl(slot);
      if (!url) {
        status.textContent = "还没有地址可测：填上面的「地址」，或让它继承到一个非空地址。";
        return;
      }
      const apiKey = effectiveApiKey(slot);
      if (slotKind(slot) === "online" && !apiKey) {
        status.textContent = "在线端点必须填 API key。";
        return;
      }
      button.disabled = true;
      status.textContent = `正在连 ${url} …`;
      try {
        const models = await listModels(url, apiKey);
        const options = models.map(m => `<option value="${esc(m)}"></option>`).join("");
        host.querySelector(`#svc-models-${slot}`).innerHTML = options;
        // 本机端点顺手把基础配置那几个模型 ID 的候选也填上，省一次「读取 LM Studio 模型」。
        if (slot === "LOCAL") root.querySelector("#model-list").innerHTML = options;
        status.textContent = models.length ? `连通，${models.length} 个可用模型已进候选` : "连通，但端点没报告任何模型";
      } catch (e) {
        status.textContent = `失败：${e}`;
      } finally {
        button.disabled = false;
      }
    }

    /** 保存前必须拦下的（方案 §6.1「在线端点若 API key 为空 → 前端即时拦截」）。
     *  这里只拦「一定跑不起来」的三类，其余交给保存后那次 doctor —— 判据集中在
     *  registry.validate() 一处，两边分级漂移比漏报更难查。 */
    function modelServiceProblems() {
      syncAdvanced();
      const problems = [];
      // 只检查**已配地址**的端点。四个槽是静态声明的，两个 ONLINE_* 出厂就写着
      // kind=online、地址与 key 都空 —— 按 kind 一刀切会让纯本地用户开局就看到两条
      // 永远修不掉的「没填 API key」，而后端 registry 对没配地址的槽本就当「未配置」
      // 直接跳过（endpoints() 里它是 None）。判据在这里跟后端对齐。
      for (const slot of SLOT_NAMES) {
        if (!effectiveUrl(slot)) continue;
        if (slotKind(slot) === "online" && !effectiveApiKey(slot)) {
          problems.push(`在线端点 ${slot}（${SLOT_LABEL[slot]}）填了地址但没填 API key，调用一定 401。`);
        }
      }
      for (const slot of new Set(ROLES.map(entry => roleSlot(entry.role)))) {
        if (!SLOT_NAMES.includes(slot)) { problems.push(`有角色指向未知端点 ${slot}。`); continue; }
        if (!effectiveUrl(slot)) problems.push(`端点 ${slot}（${SLOT_LABEL[slot]}）有角色在用，但地址为空。`);
      }
      // 在线端点必须显式给模型：本机留空由服务端默认路由，在线厂商留空一律 400。
      // 后端 registry 把这条报成 error（保存后那次 doctor 一定会拦），所以这里也拦，
      // 只是能把话说得更具体：该去哪个框里填。
      for (const entry of ROLES) {
        const slot = roleSlot(entry.role);
        if (!SLOT_NAMES.includes(slot) || slotKind(slot) !== "online") continue;
        if (!effectiveUrl(slot)) continue;  // 上面已经报过「地址为空」了
        if (!effectiveModel(entry.role).model) {
          problems.push(`${entry.label}指向在线端点 ${slot}，但该端点没填模型 ID。`);
        }
      }
      return problems;
    }

    /** 角色行的模型列是算出来的，任何影响它的输入变了都要重算一遍。 */
    function refreshRoleModels() {
      const host = root.querySelector("#model-service");
      if (!host) return;
      for (const entry of ROLES) {
        const cell = host.querySelector(`[data-role-model="${entry.role}"]`);
        if (cell) cell.outerHTML = roleModelCellHTML(entry.role);
      }
    }

    /** 拦不住但值得当场说的：都是「存得下、跑起来才炸」的那类。 */
    function refreshServiceWarnings() {
      syncAdvanced();
      refreshKindBadges();
      refreshRoleModels();
      const box = root.querySelector("#svc-warn");
      if (!box) return;
      const lines = modelServiceProblems().map(text => ({ level: "error", text }));
      const chatKey = effectiveApiKey("ONLINE_CHAT");
      const memoryKey = effectiveApiKey("ONLINE_MEMORY");
      if (chatKey && chatKey === memoryKey) {
        lines.push({ level: "warn", text: "两个在线端点用了同一把 API key：两边的提示词前缀会互相打断缓存，省钱的前提就没了。" });
      }
      // 「角色走在线端点却没有模型」已经在 modelServiceProblems() 里按 error 报了，
      // 这里只补一条提醒：整合类角色一旦指到在线端点，群聊原文就会出本机。
      for (const entry of ROLES) {
        if (!["CONSOLIDATION", "COMPACT", "EXTRACT"].includes(entry.role)) continue;
        if (slotKind(roleSlot(entry.role)) !== "online") continue;
        lines.push({ level: "warn", text: `${entry.label}指向在线端点，群聊原文会发送到该服务商。` });
      }
      box.innerHTML = lines.map(line => `<div class="svc-warn-line svc-${line.level}">${esc(line.text)}</div>`).join("");
    }

    /** 把所有 data-adv-key 控件的当前值收进 advancedValues。重绘前必须先调它，
     *  否则用户编辑中的值会被上一轮的旧值盖回去。 */
    function syncAdvanced() {
      syncMain();
      root.querySelectorAll("[data-adv-key]").forEach(input => {
        advancedValues[input.dataset.advKey] = input.value;
      });
      syncKinds();  // 类型没有控件，值只能由界面推导后写进来
    }

    function parseAdvanced() {
      const groups = new Map();
      for (const field of schemaFields) {
        if (managedKeys.has(field.key)) continue;
        const section = field.section || "其他设置";
        if (!groups.has(section)) groups.set(section, { title: section, items: [] });
        groups.get(section).items.push({
          key: field.key,
          value: advancedValues[field.key] ?? field.default ?? "",
          description: field.description || "",
          // 继承型配置项：schema 给不出字面默认值，只给「留空即继承谁」
          inherits: field.inherits || "",
        });
      }
      return [...groups.values()];
    }

    function renderAdvanced() {
      const groups = parseAdvanced();
      root.querySelector("#primary-groups").innerHTML = "";
      root.querySelector("#advanced-groups").innerHTML = groups.filter(group => group.items.length).map(group => groupHTML(group, true)).join("");
    }

    function groupHTML(group, folded) {
      const body = `<div class="advanced-fields">${group.items.map(item => `
        <div class="advanced-field">
          <label>${esc(item.key)}${item.description ? `<small>${esc(item.description)}</small>` : ""}${item.inherits ? `<small>留空即继承 ${esc(item.inherits)}</small>` : ""}</label>
          <input data-adv-key="${esc(item.key)}" value="${esc(item.value)}"${item.inherits ? ` placeholder="继承 ${esc(item.inherits)}"` : ""} />
        </div>`).join("")}</div>`;
      return folded ? `<details class="advanced-group"><summary>${esc(group.title)} <span>${group.items.length} 项</span></summary>${body}</details>` : `<section class="primary-config-group"><h3>${esc(group.title)}</h3>${body}</section>`;
    }

    function resetDefaults() {
      advancedValues = Object.fromEntries(schemaFields.map(field => [field.key, field.default ?? ""]));
      renderAdvanced();
      renderModelService();
      root.querySelector("#status").textContent = "已恢复高级配置默认值，点击保存后生效。";
    }

    function buildAdvancedEnv() {
      syncAdvanced();
      const values = { ...advancedValues };
      const known = new Set(schemaFields.map(field => field.key));
      // 继承型配置项留空时**不写入** .env。写成 `KEY=` 会让读取方拿到空串，
      // 继承链被静默切断——2026-08-28 之前 MEMORY_EXTRACT_LM_STUDIO_BASE_URL
      // 正是这样变成空串，使阶段2 候选提取每次都拼出无协议 URL 而失败。
      // 修复是三处协同的：config/settings.py 的 _env_inherit（空值回落）、
      // deploy/env_schema.py 输出 inherits 标记、以及这里的「留空不落盘」。
      const lines = schemaFields
        .filter(field => !(field.inherits && !String(values[field.key] ?? "").trim()))
        .map(field => `${field.key}=${values[field.key] ?? field.default ?? ""}`);
      for (const [key, value] of Object.entries(values)) if (!known.has(key)) lines.push(`${key}=${value}`);
      return lines.join("\n");
    }

    async function loadModels() {
      const button = root.querySelector("#btn-models");
      const status = root.querySelector("#status");
      button.disabled = true;
      status.textContent = "正在读取…";
      try {
        const models = await listModels(root.querySelector("#lm_base_url").value.trim());
        root.querySelector("#model-list").innerHTML = models.map(m => `<option value="${esc(m)}"></option>`).join("");
        status.textContent = models.length ? `已读取 ${models.length} 个模型` : "未发现已加载模型，可手工输入";
      } catch (e) {
        status.textContent = `读取失败：${e}`;
      } finally {
        button.disabled = false;
      }
    }

    async function save(event) {
      event.preventDefault();
      const button = root.querySelector("#btn-save");
      const status = root.querySelector("#status");
      const error = root.querySelector("#error");
      button.disabled = true;
      error.textContent = "";
      // 先做前端拦截：这几类问题存下去也只是让 doctor 再报一次，不如当场说清楚。
      const problems = modelServiceProblems();
      if (problems.length) {
        error.innerHTML = ["模型服务还有问题，先修好再保存：", ...problems.map(t => `· ${esc(t)}`)].join("<br />");
        status.textContent = "未保存";
        button.disabled = false;
        return;
      }
      status.textContent = "正在保存并检查…首次配置可能需要一点时间。";
      try {
        await saveConfig(collect());
        const doctor = await runDoctor();
        if (doctor.summary?.blocking) {
          location.replace("./doctor.html");
        } else {
          location.replace("./run.html");
        }
      } catch (e) {
        error.textContent = String(e);
        status.textContent = "保存失败";
        button.disabled = false;
      }
    }

    try {
      config = await getConfig();
      render();
    } catch (e) {
      root.innerHTML = `<div class="notice notice-error">无法读取配置：<code>${esc(e)}</code></div>`;
    }
  </script>
</body>
</html>
