# ============================================================
# 信号词表：signals.py 规则识别器的唯一词法来源。
# 命中判定均为「包含子串」；大小写不敏感（英文词统一小写比较）。
# ============================================================

# ---- 开放问题：向全群发问、存在社交空位（上游 §10.1）----
[open_question]
# 含这些词即视为开放问题意图
keywords = ["有人", "有没有", "有没有人", "谁知道", "谁知道吗", "哪个知道", "求推荐", "求助", "怎么才能", "怎么办", "怎么弄", "怎么设置", "该怎么"]
# 或：以问号结尾 + 疑问语气词
question_suffixes = ["?", "？"]
question_tails = ["吗", "吗？", "么", "么？", "嘛"]
# 疑问词开头/包含（配合问号结尾使用）
question_words = ["谁", "什么", "怎么", "为啥", "为什么", "哪", "咋"]

# ---- 未完成表达：话说一半、后续有人追问（上游 §10.2）----
[unfinished]
suffixes = ["…", "...", "。。", "，", ","]
teasers = ["就是", "然后", "结果", "你们猜", "你猜", "接下来", "重点来了", "笑点来了", "离谱的来了"]

# ---- 悬念钩子：值得 Stella 接一句「你又干嘛了」（上游 §11）----
[suspense]
keywords = ["离谱", "离大谱", "蠢事", "傻眼", "震惊", "你们猜", "你猜", "绷不住", "无语住了", "气死我了", "笑死我了", "炸了", "绝了", "逆天", "炸裂", "难崩", "特别蠢", "很蠢", "干了件"]

# ---- 强烈情绪（上游 §11）----
[emotion]
keywords = ["卧槽", "我靠", "牛啊", "太牛了", "好家伙", "救命", "哭死", "气死", "笑不活了", "乐死", "受不了了", "上头", "破防"]

# ---- 认可性回应：话题已被充分回应（上游 §10.3）----
[acknowledgment]
keywords = ["哦", "哦哦", "懂了", "原来如此", "学到了", "确实", "是的", "对的", "嗯嗯", "好的", "好嘞", "收到", "nb", "牛逼", "6", "赞", "可以", "行吧", "是滴", "对的呀"]

# ---- 低信息量消息：降低 Message Value 但保留结构信息（上游 §22.4）----
[low_information]
# 短于该长度且命中关键词 → 低信息量（哈/草/表情刷屏等）
max_length = 6
keywords = ["哈哈", "哈哈哈哈", "草", "6", "？", "?", "嗯", "对", "确实", "好", "行", "乐", "流汗", "黄豆", "呃", "诶"]

# ---- 话题承接/转移词：辅助判断换话题（上游 §6）----
[topic_shift]
keywords = ["对了", "另外", "话说", "说起来", "顺便", "插一句", "换个话题", "聊点别的"]

# ---- 直接社交邀请：明确拉 Stella 进对话（未达 Hard Trigger 级别，上游 §11）----
[direct_invite]
# 群友在对话中点名 Stella 但没有 @（如「stella 你不是也玩这个吗」）
name_variants = ["stella", "斯特拉", "丝黛拉"]
invite_patterns = ["你也", "你不是", "你来说说", "你觉得", "你来", "说说看"]
