[project]
name = "stella_project"
version = "3.1.0"
description = "stella_project"
readme = "README.md"
requires-python = ">=3.10, <4.0"
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "nonebot2[fastapi,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]",
    "ruff"
]

[tool.setuptools.packages.find]
include = ["stella_project*"]

[tool.nonebot]
plugin_dirs = ["stella_project/plugins"]
builtin_plugins = ["echo", "single_session"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "OneBot V12", module_name = "nonebot.adapters.onebot.v12" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
# 注：过于严苛的规则族（如 ANN 注解、BLE 盲捕、PL 复杂度、ARG 未用参数、
# T20 print、Q 引号、DTZ 时区、FBT 布尔陷阱等）已从启用集合中移除，
# 与该代码库的实际风格保持一致，避免 CI 长期挂红；仅保留能抓真问题的规则。
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "T10",   # flake8-debugger
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    "E501",    # line-too-long  # 中文注释/长字符串常见，不做硬性行宽限制
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "COM812",  # missing-trailing-comma
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    # CI 以 `-n auto --dist loadgroup` 并行执行；共享进程外资源（如 data/plugins/
    # 这种被模块路径写死的目录）的用例必须打上同一个组，才能落到同一个 worker。
    "xdist_group: 把用例固定到同一个 xdist worker",
]

[tool.coverage.run]
branch = true
omit = [
    "bot.py",                # 进程入口：import 即初始化 NoneBot，无法单元测试
    "test_compressor_trigger.py",  # 根目录遗留脚本，非测试模块
    "extensions/*",          # NapCat 集成需要真实机器人运行时，CI 无法覆盖
]

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
