name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 取消正在运行的旧工作流，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 代码质量检查 ============
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            setup.py

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (linter)
        run: ruff check . --output-format=github

  # ============ 安全扫描 ============
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit bandit

      - name: Audit dependencies for vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Run Bandit (security linter)
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # ============ 单元测试（多版本） ============
  test:
    needs: [lint, security]  # 等待检查通过后再跑测试，节省资源
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      # 即使某个版本失败，继续测试其他版本
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true  # 开发依赖可选
          pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=. \
            --cov-branch \
            --cov-report=xml \
            -n auto \
            --dist loadgroup \
            --timeout=120 \
            --timeout-method=thread

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            test-output.log

  # ============ Rust CLI（stellacli，见 design_docs/跨平台 CLI 控制台方案 v1.0.md） ============
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test

      # 子命令清单冒烟：防止重构时悄悄丢命令。与 deploy 子命令集的完整对账
      # （需要装全套 Python 依赖）暂缓，见方案 §8 的风险条目。
      - name: 帮助文本冒烟
        run: |
          cargo build --release
          ./target/release/stellacli --version
          HELP=$(./target/release/stellacli --help)
          for sub in doctor init start stop restart status logs upgrade migrate plugin capabilities manifest compose; do
            echo "$HELP" | grep -q "  $sub" || { echo "::error::帮助文本缺少子命令 $sub"; exit 1; }
          done

  # ============ 通知（可选） ============
  notify:
    needs: [test, lint, security, cli]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Check status
        id: status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.security.result }}" == "success" ] && \
             [ "${{ needs.cli.result }}" == "success" ]; then
            echo "status=✅ All checks passed!" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Some checks failed. Please check the logs." >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.status.outputs.status }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CI 运行结果\n\n${status}\n\n[查看详细日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
