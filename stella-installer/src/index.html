<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Stella</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <div class="boot">
      <div class="boot-title">Stella</div>
      <div class="boot-status" id="st">正在检查环境…</div>
    </div>
  </div>

  <script type="module">
    import { getConfig, runDoctor, runMigrate } from "./api.js";

    const st = document.getElementById("st");

    /**
     * 尚未配置时，先看看有没有上一个版本的安装。
     *
     * 有就直接进导入页——存量用户的正确起点是「把旧数据搬过来」，而不是从零填一遍
     * 配置。判据用 migrate --dry-run：它会真的预演一遍（含数据库），所以「能导入」
     * 这个结论是可信的，不是猜的。探测失败一律当作没有旧版本，不能挡住新用户。
     */
    async function hasImportableInstall() {
      try {
        const report = await runMigrate({ dryRun: true });
        return !report.includes("**导入失败**");
      } catch (e) {
        return false;
      }
    }

    /**
     * 启动路由：每次启动都自检一次，通过则直接进运行页。
     *
     * 为什么不缓存「已通过」的结果：用户可能改了 .env、换了模型、旧库没重建，
     * 那些都会让上次的结论失效。自检本身只要一两秒，用它换「坏了能立刻发现」
     * 是值得的——而这个项目最难查的几个缺陷（记忆静默失效、@ 消息不入库）
     * 恰恰都属于「看起来正常但实际坏了」。
     */
    (async () => {
      try {
        const config = await getConfig();
        if (!config.configured) {
          st.textContent = "正在查找上一个版本的数据…";
          if (await hasImportableInstall()) {
            st.textContent = "找到了旧版本，正在打开导入向导…";
            setTimeout(() => location.replace("./migrate.html"), 300);
            return;
          }
          st.textContent = "尚未完成配置，正在打开配置向导…";
          setTimeout(() => location.replace("./config.html"), 300);
          return;
        }
        const data = await runDoctor();
        if (data.summary?.blocking) {
          st.textContent = "发现需要处理的问题，正在打开环境自检…";
          setTimeout(() => location.replace("./doctor.html"), 700);
        } else {
          location.replace("./run.html");
        }
      } catch (e) {
        // 自检本身失败（Python 找不到、deploy 模块坏了）也要能进自检页——
        // 那里有完整的错误展示与排查提示，比停在启动页有用。
        st.textContent = "环境检查失败，正在打开详情…";
        setTimeout(() => location.replace("./doctor.html"), 700);
      }
    })();
  </script>
</body>
</html>
