<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Stella 设置</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand-lockup">
        <h1 class="brand">Stella</h1>
        <span class="ver">v3.7.0</span>
      </div>
      <nav class="top-nav">
        <a class="nav-secondary" href="./run.html">运行状态</a>
        <a class="nav-secondary" href="./usage.html">用量</a>
        <a class="nav-secondary" href="./plugins.html">插件</a>
        <a class="nav-secondary active" href="./settings.html?page=connection" aria-current="page">设置</a>
        <a class="nav-secondary" href="./doctor.html">环境自检</a>
      </nav>
    </header>
    <p class="subtitle">集中管理连接、模型服务、共享空间、人格与高级运行参数。</p>
    <div id="root"></div>
  </div>

  <script type="module">
    import { getConfig, saveConfig, listModels, runDoctor, getVersion, getPersonas, savePersona, installCloseOverlay, navigateToPage, readViewCache, stableSignature, writeViewCache } from "./api.js";

    const root = document.getElementById("root");
    installCloseOverlay();
    getVersion().then(v => { document.querySelector(".ver").textContent = `v${v}`; }).catch(() => {});
    let config = null;
    let schemaFields = [];
    // SUPERSEDED 旧键名单（schema payload 顶层带来）：这些键代码仍兼容读，
    // 但不该再由用户填——高级配置回写未知键时必须跳过它们，否则每次保存
    // 都会把刚被合并器迁走的旧行原样写回 .env，迁移永远不彻底。
    let supersededKeys = new Set();
    let advancedValues = {};
    let mainValues = {};
    let lastConfigSig = "";
    let configSynced = false;
    let settingsPage = new URLSearchParams(location.search).get("page") || "connection";
    let settingsPanelTransitionToken = 0;
    const SETTINGS_PAGES = new Set(["connection", "models", "persona", "advanced"]);
    const SETTINGS_PANEL_EXIT_MS = 220;
    let personas = [];
    let personasSynced = false;
    let expandedPersonaName = "";
    const EMPTY_CONFIG = {
      configured: false,
      allowed_groups: "",
      onebot_mode: "reverse",
      host: "127.0.0.1",
      port: 8080,
      ws_urls: "",
      access_token: "",
      lm_base_url: "http://127.0.0.1:1234",
      chat_model: "",
      consolidation_model: "",
      embedding_model: "",
      spaces: "",
      advanced_env: "",
      advanced_values: {},
      schema: { version: 1, fields: [] },
    };
    const ROLE_NAMES = ["CHAT", "ROUTER", "PLUGIN", "COMPACT", "CONSOLIDATION", "EXTRACT", "VISION"];
    const SLOT_NAMES = ["LOCAL", "ONLINE_CHAT", "ONLINE_MEMORY", "EXTRA"];
    // 主表单与「模型服务」分区管的键不能再出现在「高级配置」里：同一个键摆两个控件，
    // 用户改了其中一个、保存时另一个的旧值又盖回去，表现就是「改了没反应」。
    // 刻意**不**列入 LLM_ENDPOINT_LOCAL_API_KEY：本机卡没有 key 控件，高级配置是
    // 它唯一的填写处；LOCAL 地址/模型两张卡直接管（写新键），其余端点槽的同名键
    // 是「留空即继承」的覆盖项，留在高级配置里当逃生口。
    // 全部 LLM_ROLE_*_MODEL 同理降级：模型的正常出处是端点卡片，角色级只是
    // 「同一端点上某个角色换个模型」的覆盖项，卡片上不再给它控件
    // （CONSOLIDATION 例外——「记忆整合模型 ID」卡片写的就是 LLM_ROLE_CONSOLIDATION_MODEL）。
    // 四个 LLM_ENDPOINT_*_KIND 留在 managed 里但也没有控件：值由 slotKind() 按槽名
    // 与地址推导、syncKinds() 写回。放进高级配置只会让人以为改了有用——保存时推导
    // 值一定盖回去。
    const managedKeys = new Set([
      "ALLOWED_GROUPS", "HOST", "PORT", "ONEBOT_WS_URLS", "ONEBOT_ACCESS_TOKEN",
      "LLM_ENDPOINT_LOCAL_BASE_URL", "LLM_ENDPOINT_LOCAL_MODEL",
      "LLM_ROLE_CONSOLIDATION_MODEL",
      "MEMORY_EMBEDDING_MODEL",
      "MEMORY_EMBEDDING_GATE", "LLM_FALLBACK_ENABLED",
      ...SLOT_NAMES.flatMap(slot => ["KIND", "CONCURRENCY", "TIMEOUT"].map(f => `LLM_ENDPOINT_${slot}_${f}`)),
      ...SLOT_NAMES.filter(slot => slot !== "LOCAL")
        .flatMap(slot => [`LLM_ENDPOINT_${slot}_BASE_URL`, `LLM_ENDPOINT_${slot}_API_KEY`]),
      "LLM_ENDPOINT_ONLINE_CHAT_MODEL", "LLM_ENDPOINT_ONLINE_MEMORY_MODEL",
      ...ROLE_NAMES.flatMap(role =>
        ["ENDPOINT", "TEMPERATURE", "MAX_TOKENS", "FALLBACK_ENDPOINT"]
          .map(f => `LLM_ROLE_${role}_${f}`)),
    ]);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function isSecretKey(key) {
      return /(?:API_KEY|TOKEN|PASSWORD|SECRET)/i.test(String(key));
    }

    // 缓存配置页的结构与普通值，但永远不把 token、API key 或完整 .env 写入 sessionStorage。
    function configSnapshot(data) {
      const values = data.advanced_values || {};
      return {
        ...data,
        access_token: Boolean(String(data.access_token ?? "").trim()),
        advanced_env: "",
        advanced_values: Object.fromEntries(
          Object.entries(values).filter(([key]) => !isSecretKey(key)),
        ),
        secret_presence: Object.fromEntries(
          Object.entries(values)
            .filter(([key]) => isSecretKey(key))
            .map(([key, value]) => [key, Boolean(String(value ?? "").trim())]),
        ),
      };
    }

    function fromCachedConfig(snapshot) {
      return {
        ...snapshot,
        access_token: "",
        advanced_values: { ...(snapshot.advanced_values || {}) },
        advanced_env: "",
      };
    }

    function applyConfigState(data) {
      config = data;
      schemaFields = data.schema?.fields || [];
      supersededKeys = new Set(data.schema?.superseded_keys || []);
      advancedValues = { ...(data.advanced_values || {}) };
      mainValues = {
        lm_base_url: String(data.lm_base_url ?? ""),
        chat_model: String(data.chat_model ?? ""),
        consolidation_model: String(data.consolidation_model ?? ""),
        embedding_model: String(data.embedding_model ?? ""),
      };
    }

    // 配置未变化时不重建表单，只把真实密钥写回已有控件，避免闪烁和丢失焦点。
    function syncSecretInputs(data) {
      const accessToken = root.querySelector("#access_token");
      if (accessToken) accessToken.value = String(data.access_token ?? "");
      const values = data.advanced_values || {};
      root.querySelectorAll("[data-adv-key]").forEach(input => {
        if (isSecretKey(input.dataset.advKey)) input.value = String(values[input.dataset.advKey] ?? "");
      });
    }

    function selectSettingsPage(page, { updateUrl = true, animate = true } = {}) {
      const nextPage = SETTINGS_PAGES.has(page) ? page : "connection";
      const changed = settingsPage !== nextPage;
      settingsPage = nextPage;
      root.querySelectorAll("[data-settings-page]").forEach(button => {
        const active = button.dataset.settingsPage === settingsPage;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
      });
      const panels = [...root.querySelectorAll("[data-settings-panel]")];
      const activePanel = panels.find(panel => panel.dataset.settingsPanel === settingsPage);
      const currentPanel = panels.find(panel => !panel.hidden);
      const shouldAnimate = activePanel && currentPanel && currentPanel !== activePanel
        && animate && changed
        && !document.documentElement.classList.contains("page-transition-reduced");
      const transitionToken = ++settingsPanelTransitionToken;

      if (shouldAnimate) {
        panels.forEach(panel => {
          panel.hidden = panel !== currentPanel;
          panel.classList.remove("settings-panel-transition", "settings-panel-entered", "settings-panel-leaving");
        });
        currentPanel.classList.add("settings-panel-transition", "settings-panel-leaving");
        window.setTimeout(() => {
          if (transitionToken !== settingsPanelTransitionToken) return;
          currentPanel.hidden = true;
          currentPanel.classList.remove("settings-panel-transition", "settings-panel-entered", "settings-panel-leaving");
          activePanel.hidden = false;
          activePanel.classList.add("settings-panel-transition");
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (transitionToken === settingsPanelTransitionToken) {
                activePanel.classList.add("settings-panel-entered");
              }
            });
          });
        }, SETTINGS_PANEL_EXIT_MS);
      } else {
        panels.forEach(panel => {
          panel.hidden = panel !== activePanel;
          panel.classList.remove("settings-panel-transition", "settings-panel-entered", "settings-panel-leaving");
        });
      }
      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set("page", settingsPage);
        history.replaceState(null, "", url.href);
      }
    }

    function bindSettingsTabs() {
      root.querySelectorAll("[data-settings-page]").forEach(button => {
        button.onclick = () => selectSettingsPage(button.dataset.settingsPage);
      });
      selectSettingsPage(settingsPage, { updateUrl: false, animate: false });
    }

    function renderPersonaPending() {
      const host = root.querySelector("#persona-settings");
      if (!host) return;
      host.innerHTML = `
        <div class="persona-space-toolbar">
          <span class="config-status">正在同步空间与人格…</span>
        </div>
        <div class="persona-space-list">
          <div class="persona-space-pending">正在读取人格空间…</div>
        </div>`;
    }

    function personaSummary(item) {
      const groups = Array.isArray(item.groups) ? item.groups : [];
      const groupText = groups.length ? `${groups.length} 个群` : "未分配群号";
      const personaText = item.fallback ? "使用默认人格" : (item.prompt_file || "已设置人格");
      return `${groupText} · ${personaText}`;
    }

    function personaSpaceHTML(item, index) {
      const groups = Array.isArray(item.groups) ? item.groups.join(", ") : "";
      const open = item.name === expandedPersonaName ? " open" : "";
      return `
        <details class="persona-space" data-persona-index="${index}"${open}>
          <summary class="persona-space-summary">
            <span>
              <strong>${esc(item.name)}</strong>
              <small>${esc(personaSummary(item))}</small>
            </span>
          </summary>
          <div class="persona-space-body">
            <div class="persona-space-fields">
              <label>空间名
                <input data-space-name value="${esc(item.name)}" />
              </label>
              <label>群号（逗号分隔）
                <input data-space-groups value="${esc(groups)}" placeholder="例如 123456789, 987654321" />
              </label>
              <label>人格文件
                <input data-prompt-file value="${esc(item.prompt_file || "")}" placeholder="${esc(item.name)}.md" />
              </label>
            </div>
            <div class="persona-space-editor">
              <div class="persona-space-editor-toolbar">
                <div>
                  <strong>人格正文</strong>
                  <span class="persona-meta">${item.fallback ? "当前使用默认人格" : "当前使用自定义人格"}</span>
                </div>
                <div class="persona-space-actions">
                  <input type="file" data-persona-file accept=".txt,.md,text/plain" hidden />
                  <button type="button" data-import-persona>导入纯文本</button>
                  <button type="button" class="primary" data-save-persona>保存人格</button>
                </div>
              </div>
              <textarea class="persona-space-content" data-persona-content spellcheck="false">${esc(item.content)}</textarea>
              <div class="persona-footer" data-persona-status>${item.fallback ? "编辑后保存即可创建该空间的人格文件。" : "已加载自定义人格。"}</div>
            </div>
          </div>
        </details>`;
    }

    function bindPersonaSpaceControls() {
      const host = root.querySelector("#persona-settings");
      if (!host) return;
      host.querySelector("#btn-add-space")?.addEventListener("click", addPersonaSpace);
      host.querySelectorAll(".persona-space").forEach(section => {
        const index = Number(section.dataset.personaIndex);
        section.querySelector(".persona-space-summary").addEventListener("click", event => {
          event.preventDefault();
          togglePersonaSpace(section, index);
        });
        section.querySelector("[data-save-persona]").onclick = () => savePersonaAt(index, section);
        section.querySelector("[data-import-persona]").onclick = () => section.querySelector("[data-persona-file]").click();
        section.querySelector("[data-persona-file]").onchange = event => importPersonaText(event, section, index);
      });
    }

    function togglePersonaSpace(section, index) {
      const sections = [...root.querySelectorAll(".persona-space")];
      const before = new Map(sections.map(item => [item, item.getBoundingClientRect()]));
      const open = !section.open;
      const current = personas[index];
      section.open = open;
      if (open) {
        expandedPersonaName = current?.name || "";
      } else if (expandedPersonaName === current?.name) {
        expandedPersonaName = "";
      }
      requestAnimationFrame(() => {
        for (const item of sections) {
          const from = before.get(item);
          const to = item.getBoundingClientRect();
          if (!from || (Math.abs(from.top - to.top) < 1 && Math.abs(from.left - to.left) < 1)) continue;
          item.animate(
            [
              { transform: `translate(${from.left - to.left}px, ${from.top - to.top}px)` },
              { transform: "translate(0, 0)" },
            ],
            {
              duration: 420,
              easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            },
          );
        }
      });
    }

    function renderPersona() {
      const host = root.querySelector("#persona-settings");
      if (!host) return;
      if (!personasSynced) {
        renderPersonaPending();
        return;
      }
      host.innerHTML = `
        <div class="persona-space-toolbar">
          <button type="button" id="btn-add-space">+ 创建人格空间</button>
        </div>
        <div class="persona-space-list">
          ${personas.length
            ? personas.map(personaSpaceHTML).join("")
            : `<div class="notice">还没有人格空间。点击上方按钮创建一个。</div>`}
        </div>`;
      bindPersonaSpaceControls();
    }

    function parseGroupText(value) {
      return String(value ?? "")
        .split(/[,\s]+/)
        .map(item => item.trim())
        .filter(Boolean);
    }

    function syncPersonaDraft(index, section = null) {
      const current = personas[index];
      section ||= root.querySelector(`.persona-space[data-persona-index="${index}"]`);
      if (!current || !section) return;
      const name = section.querySelector("[data-space-name]");
      const groups = section.querySelector("[data-space-groups]");
      const file = section.querySelector("[data-prompt-file]");
      const content = section.querySelector("[data-persona-content]");
      if (!name || !groups || !file || !content) return;
      current.name = name.value.trim();
      current.groups = parseGroupText(groups.value);
      current.prompt_file = file.value.trim();
      current.content = content.value;
      current.fallback = false;
    }

    function syncAllPersonaDrafts() {
      root.querySelectorAll(".persona-space").forEach(section => {
        syncPersonaDraft(Number(section.dataset.personaIndex), section);
      });
    }

    function nextPersonaSpaceName() {
      const names = new Set(personas.map(item => item.name));
      let number = personas.length + 1;
      while (names.has(`space_${number}`)) number += 1;
      return `space_${number}`;
    }

    function addPersonaSpace() {
      syncAllPersonaDrafts();
      const name = nextPersonaSpaceName();
      personas.push({
        name,
        groups: [],
        prompt_file: `${name}.md`,
        fallback: true,
        content: "",
      });
      expandedPersonaName = name;
      renderPersona();
    }

    async function importPersonaText(event, section, index) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const bytes = await file.arrayBuffer();
        const content = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        if (content.includes("\0")) throw new Error("文件包含二进制内容，不是纯文本");
        section.querySelector("[data-persona-content]").value = content;
        const input = section.querySelector("[data-prompt-file]");
        if (!input.value.trim()) input.value = file.name.endsWith(".md")
          ? file.name : `${personas[index].name}.md`;
        section.querySelector("[data-persona-status]").textContent = "已导入，点击保存人格后写入当前空间。";
      } catch (error) {
        section.querySelector("[data-persona-status]").textContent = `导入失败：${error}`;
      }
      event.target.value = "";
    }

    async function savePersonaAt(index, section) {
      syncPersonaDraft(index, section);
      const persona = personas[index];
      const button = section.querySelector("[data-save-persona]");
      const status = section.querySelector("[data-persona-status]");
      if (!persona) return;
      button.disabled = true;
      status.textContent = "正在保存…";
      try {
        await savePersona(persona.name, persona.prompt_file, persona.content);
        personas = await getPersonas();
        personasSynced = true;
        expandedPersonaName = persona.name;
        renderPersona();
      } catch (error) {
        status.textContent = `保存失败：${error}`;
        button.disabled = false;
      }
    }

    function render() {
      root.innerHTML = `
        <div class="settings-tabs" role="tablist" aria-label="设置分页">
          <button type="button" class="settings-tab active" data-settings-page="connection" role="tab">基础连接</button>
          <button type="button" class="settings-tab" data-settings-page="models" role="tab">模型服务</button>
          <button type="button" class="settings-tab" data-settings-page="persona" role="tab">人格空间</button>
          <button type="button" class="settings-tab" data-settings-page="advanced" role="tab">高级配置</button>
          <div class="settings-actions">
            <button type="button" class="settings-action" id="btn-migrate">导入旧配置</button>
            <button type="submit" form="config-form" class="primary settings-action" id="btn-save">保存</button>
          </div>
        </div>
        <div class="settings-toolbar">
          <span class="config-status" id="status"></span>
        </div>
        <div class="settings-panel" data-settings-panel="connection">
        <div class="settings-section-head">
          <p>配置 Stella 与 OneBot 的连接方式、监听参数和访问凭据。</p>
        </div>
        <div class="config-card">
          <form id="config-form">
            <div class="config-grid">
              <div class="config-field">
                <label for="onebot_mode">OneBot 连接方式</label>
                <select id="onebot_mode">
                  <option value="reverse" ${config.onebot_mode === "reverse" ? "selected" : ""}>反向 WS：Stella 监听端口</option>
                  <option value="forward" ${config.onebot_mode === "forward" ? "selected" : ""}>正向 WS：连接 NapCat 服务端</option>
                </select>
              </div>
              <div class="config-field">
                <label for="access_token">OneBot access token（可留空）</label>
                <input id="access_token" type="password" value="${esc(config.access_token)}" />
              </div>
              <div class="config-field reverse-only">
                <label for="host">监听地址</label>
                <input id="host" value="${esc(config.host)}" />
              </div>
              <div class="config-field reverse-only">
                <label for="port">监听端口</label>
                <input id="port" type="number" min="1" max="65535" value="${esc(config.port)}" />
              </div>
              <div class="config-field full forward-only">
                <label for="ws_urls">NapCat WS 服务端地址（逗号分隔）</label>
                <textarea id="ws_urls" placeholder="ws://127.0.0.1:3001">${esc(config.ws_urls)}</textarea>
              </div>
              <datalist id="model-list"></datalist>
            </div>
            <div class="config-actions">
              <span class="config-status">设置会在保存后统一校验，成功后进入运行状态。</span>
            </div>
            <div class="config-error" id="error"></div>
          </form>
        </div>
        </div>
        <section class="settings-panel" data-settings-panel="models" hidden>
          <div class="settings-section-head">
            <p>配置模型端点，并为对话、记忆和插件任务分配合适的模型。</p>
          </div>
          <section class="svc" id="model-service"></section>
          <div class="config-actions">
            <button type="button" id="btn-models">读取本机 LM Studio 模型</button>
          </div>
        </section>
        <section class="settings-panel" data-settings-panel="persona" hidden>
          <div class="settings-section-head">
            <p>管理共享空间的群组绑定、人格文件和长期记忆范围。</p>
          </div>
          <div id="persona-settings"></div>
        </section>
        <section class="settings-panel" data-settings-panel="advanced" hidden>
          <div class="settings-section-head">
            <p>调整 Stella 的完整运行参数，适合需要精细控制行为的场景。</p>
          </div>
          <div class="config-card">
            <button type="button" id="btn-reset-defaults">重置高级配置为默认值</button>
            <div id="advanced-groups"></div>
          </div>
        </section>
        `;

      const mode = root.querySelector("#onebot_mode");
      const updateMode = () => {
        root.querySelectorAll(".reverse-only").forEach(e => e.style.display = mode.value === "reverse" ? "" : "none");
        root.querySelectorAll(".forward-only").forEach(e => e.style.display = mode.value === "forward" ? "" : "none");
      };
      mode.onchange = updateMode;
      updateMode();
      bindSettingsTabs();
      schemaFields = config.schema?.fields || [];
      supersededKeys = new Set(config.schema?.superseded_keys || []);
      advancedValues = { ...(config.advanced_values || {}) };
      // 这四个键的控件长在「模型服务」的卡片里，而那一片会被 renderModelService()
      // 整段重绘（换预设、重置默认值时）。重绘会把 DOM 连根换掉，所以值另存一份，
      // 否则用户刚打的地址会在点一下预设之后消失。
      mainValues = {
        lm_base_url: String(config.lm_base_url ?? ""),
        chat_model: String(config.chat_model ?? ""),
        consolidation_model: String(config.consolidation_model ?? ""),
        embedding_model: String(config.embedding_model ?? ""),
      };
      renderAdvanced();
      // 高级配置的行内校验用事件委托绑在容器上：字段 DOM 会被重绘整段替换，
      // 绑在容器上就不用每次重绘后重绑。
      root.querySelector("#advanced-groups").addEventListener("input", applyAdvancedValidation);
      root.querySelector("#advanced-groups").addEventListener("change", applyAdvancedValidation);
      renderModelService();
      root.querySelector("#btn-models").onclick = loadModels;
      root.querySelector("#btn-reset-defaults").onclick = resetDefaults;
      renderPersona();
      root.querySelector("#btn-migrate").onclick = () => { navigateToPage("./migrate.html"); };
      root.querySelector("#config-form").onsubmit = save;
    }

    function collect() {
      const value = id => root.querySelector(`#${id}`).value.trim();
      return {
        allowed_groups: "",
        onebot_mode: value("onebot_mode"),
        host: value("host"),
        port: Number(value("port")),
        ws_urls: value("ws_urls"),
        access_token: value("access_token"),
        // 这四个的控件在端点卡片里（id 保持不变：Rust 侧的 managed 强写清单按 id 取值）
        lm_base_url: mainValue("lm_base_url"),
        chat_model: mainValue("chat_model"),
        consolidation_model: mainValue("consolidation_model"),
        embedding_model: mainValue("embedding_model"),
        spaces: serializePersonaSpaces(),
        advanced_env: buildAdvancedEnv(),
      };
    }

    function serializePersonaSpaces() {
      syncAllPersonaDrafts();
      const sections = [...root.querySelectorAll(".persona-space")];
      if (!sections.length) return config?.spaces || "";
      return sections.map(section => {
        const persona = personas[Number(section.dataset.personaIndex)];
        if (!persona) return "";
        return `${persona.name} | ${persona.prompt_file} | ${persona.groups.join(",")}`;
      }).filter(line => line.replace(/[|\s]/g, "").length > 0).join("\n");
    }

    // ── 模型服务：端点 × 角色 ──
    //
    // 本分区的控件，除了卡片里那四个主表单键（#lm_base_url / #chat_model /
    // #consolidation_model / #embedding_model，Rust 侧按 id 取值）之外都带
    // data-adv-key，因此走的是「高级配置」那条既有链路：
    // buildAdvancedEnv() 收集 → advanced_env 文本 → Rust apply_advanced_env 落盘。
    // 复用而不另开一条的关键理由：「继承型字段留空就不写入 .env」这条规则只写在
    // buildAdvancedEnv 一处，而角色模型（LLM_ROLE_*_MODEL）留空必须继续继承本机
    // 模型 ID —— 写成 `KEY=` 会把继承链静默切断（2026-08-28 那个 bug 的根因）。

    const SLOT_LABEL = {
      LOCAL: "本机 LM Studio",
      ONLINE_CHAT: "在线 · 对话生成",
      ONLINE_MEMORY: "在线 · 记忆整合",
      EXTRA: "备用 / 第二个本机实例",
    };
    const SLOT_NOTE = {
      LOCAL: "本机 LM Studio 的地址与模型 ID 就填在这张卡上（对应 LM_STUDIO_BASE_URL / LM_STUDIO_MODEL）。指到这张卡的角色默认都用这个模型；纯在线部署可以整张卡留空。",
      ONLINE_CHAT: "对话生成专用 key。必须与「在线 · 记忆整合」用不同的一把：两边的提示词前缀分属不同缓存域，共用一把 key 会互相打断缓存，省钱的前提就没了。",
      ONLINE_MEMORY: "记忆整合与会话压缩专用 key。请知悉：整合会把群聊原文发送到这家服务商。",
      EXTRA: "地址留空即沿用 CONSOLIDATION_LM_STUDIO_BASE_URL（它再继承本机地址）。纯本地场景下它与本机同址，作用只是让整合有独立的并发闸门。模型对应 CONSOLIDATION_LM_STUDIO_MODEL。把地址改指服务商，这张卡就自动按在线处理（卡头的类型徽标会跟着变）。",
    };
    // ── 角色绑定（binding = 角色 × 槽）──────────────────────────────────
    // 矩阵里的一行不是「角色」而是「一条绑定」：一个角色将来可能有多张卡
    // （同一角色按用途拆到不同端点——例如对话拆「主回复 / 兜底回复」两条绑定，
    // 或视觉角色将来加第二张卡），所以所有遍历都走 binding 而不是裸角色名。
    //   unbindable   允许 ENDPOINT=none：该角色可整体关闭，矩阵下拉里给「未绑定」项
    //   defaultSlot  .env 键留空时解析到的槽（VISION 默认 none = 出厂关闭）
    //   sendsContent 指到在线端点时会把群聊内容发出去（隐私提醒用）
    const ROLE_BINDINGS = [
      { role: "CHAT",         label: "对话生成", help: "回复群友的主模型，质量优先。",                              defaultSlot: "LOCAL" },
      { role: "ROUTER",       label: "兜底判定", help: "判断「这条要不要回」。二分类任务，廉价模型足够。",          defaultSlot: "LOCAL" },
      { role: "PLUGIN",       label: "插件调用", help: "第三方插件借用的 LLM。插件代码拿不到这里的 key。",          defaultSlot: "LOCAL" },
      { role: "COMPACT",      label: "会话压缩", help: "把较早的对话压成回顾。默认归记忆域，与整合共用缓存以省钱。", defaultSlot: "LOCAL", sendsContent: true },
      { role: "CONSOLIDATION",label: "记忆整合", help: "阶段 1 总结。量大而低频，廉价模型足够。",                  defaultSlot: "EXTRA",  sendsContent: true },
      { role: "EXTRACT",      label: "记忆提取", help: "阶段 2 高精度抽取。频次低，值得用强模型。",                 defaultSlot: "LOCAL", sendsContent: true },
      { role: "VISION",       label: "图片转述", help: "可选：把 @ 消息里的图片转成一句文字描述。默认不绑端点 = 关闭；绑在线端点时群聊图片会发给服务商。", defaultSlot: "none", unbindable: true, sendsContent: true },
    ];
    /** 按角色名取它的绑定（将来一个角色有多张卡时返回多条）。 */
    function roleBindings(roleName) { return ROLE_BINDINGS.filter(entry => entry.role === roleName); }
    // 三个预设只动「角色 → 端点」这一列：地址与 key 是用户填进去的，预设不该清掉，
    // 否则点一下预设就把 key 弄丢了。MEMORY_EMBEDDING_GATE 在三个场景里都是 auto
    // （auto 自己会解析成「共用本地槽闸门」或「不排队」），所以也不在预设范围内。
    const PRESETS = {
      local: { name: "纯本地", map: { CHAT: "LOCAL", ROUTER: "LOCAL", PLUGIN: "LOCAL", COMPACT: "LOCAL", CONSOLIDATION: "EXTRA", EXTRACT: "LOCAL" } },
      online: { name: "纯在线（双 key）", map: { CHAT: "ONLINE_CHAT", ROUTER: "ONLINE_CHAT", PLUGIN: "ONLINE_CHAT", COMPACT: "ONLINE_MEMORY", CONSOLIDATION: "ONLINE_MEMORY", EXTRACT: "ONLINE_MEMORY" } },
      mixed: { name: "混合（对话在线 · 整合本地）", map: { CHAT: "ONLINE_CHAT", ROUTER: "ONLINE_CHAT", PLUGIN: "ONLINE_CHAT", COMPACT: "LOCAL", CONSOLIDATION: "LOCAL", EXTRACT: "LOCAL" } },
    };

    function fieldMeta(key) { return schemaFields.find(field => field.key === key) || {}; }
    function advValue(key) { return String(advancedValues[key] ?? fieldMeta(key).default ?? ""); }
    function advPlaceholder(key) {
      const meta = fieldMeta(key);
      return meta.inherits ? `继承 ${meta.inherits}` : String(meta.default ?? "");
    }
    function urlKeyOf(slot) { return slot === "LOCAL" ? "LM_STUDIO_BASE_URL" : `LLM_ENDPOINT_${slot}_BASE_URL`; }
    function apiKeyOf(slot) { return slot === "LOCAL" ? "LM_STUDIO_API_KEY" : `LLM_ENDPOINT_${slot}_API_KEY`; }

    // 主表单那四个键的控件长在卡片里。id 不能改：Rust 侧的 managed 强写清单按
    // 这几个 id 从表单取值，改名就是「保存了但 .env 没变」。
    const MAIN_IDS = ["lm_base_url", "chat_model", "consolidation_model", "embedding_model"];
    // 哪张卡的「模型」框用的是主表单的旧键（而不是端点级的 LLM_ENDPOINT_<槽>_MODEL）。
    // 与 registry 的 _LEGACY_MODEL_HOME_SLOT 是同一张表，反过来写。
    const CARD_MODEL_MAIN_ID = { LOCAL: "chat_model", EXTRA: "consolidation_model" };

    function syncMain() {
      for (const id of MAIN_IDS) {
        const el = root.querySelector(`#${id}`);
        if (el) mainValues[id] = el.value;
      }
    }
    /** 主表单键的当前值。控件还没建好（首次 render）或刚被重绘掉时读值仓。 */
    function mainValue(id) {
      const el = root.querySelector(`#${id}`);
      return String(el ? el.value : (mainValues[id] ?? "")).trim();
    }

    /** 端点真正会用到的地址：把 settings.py 里那条继承链走完，与运行时一致。 */
    function effectiveUrl(slot) {
      if (slot === "LOCAL") return advValue("LLM_ENDPOINT_LOCAL_BASE_URL").trim() || mainValue("lm_base_url");
      if (slot === "EXTRA") {
        return advValue("LLM_ENDPOINT_EXTRA_BASE_URL").trim()
          || advValue("CONSOLIDATION_LM_STUDIO_BASE_URL").trim()
          || mainValue("lm_base_url");
      }
      return advValue(urlKeyOf(slot)).trim();
    }
    /** 同上，但取 key。只在「测试连接」的请求头里用掉，不显示、不落别处。 */
    function effectiveApiKey(slot) {
      if (slot === "LOCAL") return advValue("LLM_ENDPOINT_LOCAL_API_KEY").trim() || advValue("LM_STUDIO_API_KEY").trim();
      if (slot === "EXTRA") return advValue("LLM_ENDPOINT_EXTRA_API_KEY").trim() || advValue("CONSOLIDATION_LM_STUDIO_API_KEY").trim();
      return advValue(apiKeyOf(slot)).trim();
    }
    // 类型（KIND）不再是卡片上的控件：四个槽的类型本来就能算出来，让人再选一遍
    // 只会选错——把在线卡选成 local 就绕过了「在线端点必须有 key」这条拦截。
    //   · 两个 ONLINE_* 槽固定 online：槽名就是声明。这两个槽**不能**按地址猜，
    //     否则会误判本机中转网关（one-api 这类跑在 127.0.0.1、却按上游厂商计费的
    //     转发层）——那种部署地址是本机的，钱却是真花。
    //   · 本机与备用两张卡按**地址**判断（这两张卡的地址用户是可以改指的）。
    //     不按「有没有 api_key」判断：本机网关要求 dummy key 的人会被误判成在线，
    //     从而漏发 reasoning_effort=none（本地推理模型把 token 全耗在思维链上）。
    const FIXED_SLOT_KIND = { ONLINE_CHAT: "online", ONLINE_MEMORY: "online" };
    /** 地址是否指向本机/局域网。空地址算本机：LOCAL / EXTRA 留空就是继承本机地址。 */
    function looksLocalUrl(url) {
      const host = (/^[a-z][a-z0-9+.-]*:\/\/([^/:?#]+)/i.exec(String(url).trim()) || [])[1] || "";
      if (!host) return true;
      if (/^(localhost|127\.|0\.0\.0\.0$|\[?::1\]?$|host\.docker\.internal$)/i.test(host)) return true;
      if (/^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(host)) return true;
      return !host.includes(".");  // 裸主机名 = 同网段的另一台机器
    }
    function slotKind(slot) {
      return FIXED_SLOT_KIND[slot] || (looksLocalUrl(effectiveUrl(slot)) ? "local" : "online");
    }
    /** 类型没有控件了，所以保存前得由界面把推导结果写回值仓：buildAdvancedEnv() 对
     *  schema 里的每个键都会落一行，不写就会落成 settings.py 里的默认值（EXTRA 的
     *  默认是 local，那么把它指向服务商之后仍然会被当本机，在线的校验全部失效）。 */
    function syncKinds() {
      for (const slot of SLOT_NAMES) advancedValues[`LLM_ENDPOINT_${slot}_KIND`] = slotKind(slot);
    }
    const KIND_BADGE = {
      local: { text: "本机 · 不计费", cls: "svc-kind-local" },
      online: { text: "在线 · 按量计费", cls: "svc-kind-online" },
    };
    /** 卡片头上的类型徽标，只读。备用/本机卡会随地址变，所以要能原地重画。 */
    function kindBadgeHTML(slot) {
      const badge = KIND_BADGE[slotKind(slot)] || KIND_BADGE.local;
      const title = FIXED_SLOT_KIND[slot]
        ? "在线槽，类型固定" : "按地址判断：本机/局域网地址算本机，其他算在线服务商";
      return `<span class="svc-kind ${badge.cls}" data-slot-kind="${esc(slot)}" title="${esc(title)}">${esc(badge.text)}</span>`;
    }
    function refreshKindBadges() {
      const host = root.querySelector("#model-service");
      if (!host) return;
      for (const slot of SLOT_NAMES) {
        const badge = host.querySelector(`[data-slot-kind="${slot}"]`);
        if (badge) badge.outerHTML = kindBadgeHTML(slot);
      }
    }
    /** 绑定当前指向的槽。值是裸槽名或 "none"（unbindable 角色的关闭态）；
     *  调用方必须先判 `slot === "none"` 再当槽名用。 */
    function roleSlot(binding) {
      const raw = advValue(`LLM_ROLE_${binding.role}_ENDPOINT`).trim();
      return raw || binding.defaultSlot;
    }
    /** 槽值是否为「未绑定」哨兵。后端 endpoint() 对 none 大小写不敏感
     *  （先 upper 再比），这里对齐——.env 里写 NONE 也应判成关闭。 */
    const isUnboundSlot = slot => String(slot || "").toLowerCase() === "none";
    /** 该绑定当前是否处于「未绑定 = 角色关闭」状态。 */
    function roleUnbound(binding) {
      return binding.unbindable === true && isUnboundSlot(roleSlot(binding));
    }

    // ── 模型 ID 的三档解析（必须与 core/llm/registry.py 的 _resolve_role_model 一致）──
    //
    // 顺序：角色显式 MODEL → 该角色所绑端点的 MODEL → 角色自己的旧键。
    // 界面这边算一遍，只为了在角色行里显示「这个角色最终会用哪个模型、来自哪里」——
    // 角色行不再放模型输入框（模型在端点卡片上填一次就够），但用户仍要能看见结果。
    const ROLE_MODEL_LEGACY_KEY = {
      CHAT: "LM_STUDIO_MODEL",
      ROUTER: "LM_STUDIO_MODEL",
      PLUGIN: "ASTRBOT_LLM_MODEL",
      COMPACT: "LM_STUDIO_MODEL",
      CONSOLIDATION: "CONSOLIDATION_LM_STUDIO_MODEL",
      EXTRACT: "MEMORY_EXTRACT_LM_STUDIO_MODEL",
    };
    const LEGACY_MODEL_HOME_SLOT = {
      LM_STUDIO_MODEL: "LOCAL",
      ASTRBOT_LLM_MODEL: "LOCAL",
      MEMORY_EXTRACT_LM_STUDIO_MODEL: "LOCAL",
      CONSOLIDATION_LM_STUDIO_MODEL: "EXTRA",
    };

    /** 旧键的实际值。两个直接键的控件在卡片上；另两个是继承型，留空即继承 LM_STUDIO_MODEL。 */
    function legacyModelValue(key) {
      if (key === "LM_STUDIO_MODEL") return mainValue("chat_model");
      if (key === "CONSOLIDATION_LM_STUDIO_MODEL") return mainValue("consolidation_model");
      return advValue(key).trim() || mainValue("chat_model");
    }

    /** 端点级模型（第二档）。LOCAL / EXTRA 这两张卡上填的是旧键，端点级键是逃生口。 */
    function endpointModel(slot) { return advValue(`LLM_ENDPOINT_${slot}_MODEL`).trim(); }

    /** 角色最终用的模型 + 出处（出处只给人看，出错时能一眼知道该去改哪个框）。
     *  未绑定的角色返回空，由渲染层显示「未启用」。 */
    function effectiveModel(binding) {
      const legacyKey = ROLE_MODEL_LEGACY_KEY[binding.role] || "";
      const legacy = legacyKey ? legacyModelValue(legacyKey) : "";
      const explicit = advValue(`LLM_ROLE_${binding.role}_MODEL`).trim();
      // 「显式」的判据与后端一致：值与它继承的旧键不同才算用户单独指定过。
      if (explicit && explicit !== legacy) return { model: explicit, from: `角色覆盖 LLM_ROLE_${binding.role}_MODEL` };
      const slot = roleSlot(binding);
      if (isUnboundSlot(slot)) return { model: "", from: "" };
      const slotModel = endpointModel(slot);
      if (slotModel) return { model: slotModel, from: `端点 ${slot} 的 MODEL` };
      // 旧键垫底，但在线槽上只认「这张卡自己的那个旧键」：别的旧键装的是本机模型名，
      // 发给在线服务商一律 400，不如在这里就显示成「未指定」。
      if (slotKind(slot) !== "online" || slot === LEGACY_MODEL_HOME_SLOT[legacyKey]) {
        return { model: legacy, from: legacy ? `端点 ${slot} 的模型（${legacyKey}）` : "" };
      }
      return { model: "", from: "" };
    }

    /** 槽名下拉。.env 里若写着未知槽名，作为一个显式选项保留——静默改成 LOCAL
     *  等于替用户改配置，而 registry.validate() 本来就会把非法槽名报成 error。
     *  unbindable 角色额外给一项 none（「未绑定」），语义化地对应「角色关闭」。 */
    function slotOptions(current, blankLabel = "", unbindable = false) {
      // none 大小写归一：.env 写 NONE 时按哨兵渲染，不当成未知槽名
      const isNone = isUnboundSlot(current);
      // none 在不接受它的下拉里（如 FALLBACK_ENDPOINT）语义上等价于「留空」，
      // 不当成未知槽名渲染——后端本来就把它当合法的空处理。
      const normalized = isNone && !unbindable ? "" : (isNone ? "none" : current);
      const names = SLOT_NAMES.includes(normalized) || !normalized ? SLOT_NAMES : [...SLOT_NAMES, normalized];
      const noneOpt = unbindable
        ? `<option value="none" ${isNone ? "selected" : ""}>none · 未绑定（关闭）</option>`
        : "";
      const head = blankLabel ? `<option value="" ${normalized ? "" : "selected"}>${esc(blankLabel)}</option>` : "";
      return head + noneOpt + names.map(slot => {
        const label = SLOT_LABEL[slot] ? `${slot} · ${SLOT_LABEL[slot]}` : `${slot}（未知槽名）`;
        return `<option value="${esc(slot)}" ${slot === normalized ? "selected" : ""}>${esc(label)}</option>`;
      }).join("");
    }
      const head = blankLabel ? `<option value="" ${current ? "" : "selected"}>${esc(blankLabel)}</option>` : "";
      return head + noneOpt + names.map(slot => {
        const label = SLOT_LABEL[slot] ? `${slot} · ${SLOT_LABEL[slot]}` : `${slot}（未知槽名）`;
        return `<option value="${esc(slot)}" ${slot === current ? "selected" : ""}>${esc(label)}</option>`;
      }).join("");
    }

    function endpointCardHTML(slot) {
      const urlKey = urlKeyOf(slot);
      const keyKey = apiKeyOf(slot);
      const isLocal = slot === "LOCAL";
      // 逃生口被用上时要显式说出来，否则卡片显示的值和运行时用的值不一致。
      const tags = [];
      const urlOverride = isLocal ? advValue("LLM_ENDPOINT_LOCAL_BASE_URL").trim() : "";
      if (urlOverride) tags.push(`地址已被高级配置 LLM_ENDPOINT_LOCAL_BASE_URL 覆盖到 ${urlOverride}`);
      const mainModelId = CARD_MODEL_MAIN_ID[slot] || "";
      const modelOverride = mainModelId ? endpointModel(slot) : "";
      if (modelOverride) tags.push(`模型已被高级配置 LLM_ENDPOINT_${slot}_MODEL 覆盖到 ${modelOverride}`);
      // LOCAL 的地址控件就是原来基础配置里的那一个（#lm_base_url 搬进卡片，id 不变）。
      const urlField = isLocal
        ? `<input id="lm_base_url" value="${esc(mainValue("lm_base_url"))}" placeholder="http://127.0.0.1:1234" />`
        : `<input data-adv-key="${esc(urlKey)}" data-svc-url="${esc(slot)}" value="${esc(advValue(urlKey))}"
                 placeholder="${esc(advPlaceholder(urlKey) || "https://api.example.com（填服务根地址，不要带 /v1）")}" />`;
      // 模型同理：LOCAL / EXTRA 用主表单的旧键（#chat_model / #consolidation_model），
      // 两个在线槽用端点级键。候选列表各指自己卡片「测试连接」拉回来的那份。
      const modelField = mainModelId
        ? `<input id="${esc(mainModelId)}" list="model-list" value="${esc(mainValue(mainModelId))}"
                 placeholder="${esc(mainModelId === "chat_model" ? "例如 google/gemma-3-27b（留空则由本机服务端默认路由）" : "例如 google/gemma-3-4b")}" />`
        : `<input data-adv-key="LLM_ENDPOINT_${esc(slot)}_MODEL" list="svc-models-${esc(slot)}"
                 value="${esc(endpointModel(slot))}" placeholder="服务商文档里的模型 ID，例如 deepseek-chat" />`;
      return `
        <details class="svc-card" data-slot="${esc(slot)}">
          <summary class="svc-card-summary">
            <div class="svc-card-head">
              <b>${esc(SLOT_LABEL[slot])}</b><code>${esc(slot)}</code>
              ${kindBadgeHTML(slot)}
              ${tags.map(text => `<span class="svc-tag">${esc(text)}</span>`).join("")}
            </div>
            <span class="svc-note">${esc(SLOT_NOTE[slot])}</span>
          </summary>
          <div class="svc-card-body">
            <div class="svc-card-grid">
              <label class="svc-f-url">地址${urlField}</label>
              <label class="svc-f-model">模型 ID${modelField}</label>
              <label class="svc-f-key">API key
                <input type="password" data-adv-key="${esc(keyKey)}" data-svc-key="${esc(slot)}"
                       value="${esc(advValue(keyKey))}"
                       placeholder="${esc(advPlaceholder(keyKey) || (isLocal ? "本机一般不校验，可留空" : "在线端点必填"))}" />
              </label>
              <label class="svc-f-num">并发度
                <input inputmode="numeric" data-adv-key="LLM_ENDPOINT_${esc(slot)}_CONCURRENCY"
                       value="${esc(advValue(`LLM_ENDPOINT_${slot}_CONCURRENCY`))}" />
              </label>
              <label class="svc-f-num">超时（秒）
                <input inputmode="numeric" data-adv-key="LLM_ENDPOINT_${esc(slot)}_TIMEOUT"
                       value="${esc(advValue(`LLM_ENDPOINT_${slot}_TIMEOUT`))}" />
              </label>
            </div>
            <div class="svc-card-foot">
              <button type="button" data-svc-test="${esc(slot)}">测试连接</button>
              <span class="config-status" data-svc-status="${esc(slot)}"></span>
            </div>
            <datalist id="svc-models-${esc(slot)}"></datalist>
          </div>
        </details>`;
    }

    function toggleServiceCard(section) {
      const cards = [...root.querySelectorAll(".svc-card")];
      const before = new Map(cards.map(item => [item, item.getBoundingClientRect()]));
      const open = !section.open;
      for (const item of cards) item.open = open && item === section;
      requestAnimationFrame(() => {
        for (const item of cards) {
          const from = before.get(item);
          const to = item.getBoundingClientRect();
          if (!from || (Math.abs(from.top - to.top) < 1 && Math.abs(from.left - to.left) < 1)) continue;
          item.animate(
            [
              { transform: `translate(${from.left - to.left}px, ${from.top - to.top}px)` },
              { transform: "translate(0, 0)" },
            ],
            {
              duration: 420,
              easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            },
          );
        }
      });
    }

    /** 角色行的「模型」列：只读显示，不给输入框。
     *
     *  模型在端点卡片上填一次就够了（一个端点通常只对应一家服务商的一份模型清单），
     *  在六个角色上再各写一遍同一个字符串，除了让人漏改其中一行没有别的作用。
     *  真要让某个角色在同一端点上换模型，改高级配置里的 LLM_ROLE_<角色>_MODEL —— 那时
     *  这里会显示成「角色覆盖」，不至于让人以为界面没生效。
     */
    function roleModelCellHTML(binding) {
      if (isUnboundSlot(roleSlot(binding))) {
        return `<span class="svc-model svc-model-empty" data-role-model="${esc(binding.role)}"><i>未启用 —— 端点为 none，该角色关闭</i></span>`;
      }
      const { model, from } = effectiveModel(binding);
      if (model) {
        return `<span class="svc-model" data-role-model="${esc(binding.role)}">${esc(model)}<small>${esc(from)}</small></span>`;
      }
      const hint = slotKind(roleSlot(binding)) === "online"
        ? "未指定 —— 在端点卡片的「模型 ID」里填"
        : "留空：由本机服务端默认路由";
      return `<span class="svc-model svc-model-empty" data-role-model="${esc(binding.role)}"><i>${esc(hint)}</i></span>`;
    }

    // 数值列刻意用 text + inputmode 而非 type="number"：number 控件读到 .env 里
    // 已有的非法值会把 value 变成空串，syncAdvanced 一收就静默清空了用户配置。
    function roleRowHTML(entry) {
      const key = suffix => `LLM_ROLE_${entry.role}_${suffix}`;
      const slot = roleSlot(entry);
      const num = suffix => `<input inputmode="decimal" data-adv-key="${esc(key(suffix))}"
             value="${esc(advValue(key(suffix)))}" placeholder="${esc(advPlaceholder(key(suffix)))}" />`;
      // data-role 上是「角色名」，data-binding 上是这条绑定的稳定 id（将来一个角色
      // 有多张卡时用 `${role}:${index}` 区分，眼下与 data-role 同值）。
      return `
        <div class="svc-row" data-role="${esc(entry.role)}" data-binding="${esc(entry.role)}">
          <span class="svc-role"><b>${esc(entry.label)}</b><small>${esc(entry.help)}</small></span>
          <select data-adv-key="${esc(key("ENDPOINT"))}" data-role-endpoint="${esc(entry.role)}">${slotOptions(slot, "", entry.unbindable === true)}</select>
          ${roleModelCellHTML(entry)}
          ${num("TEMPERATURE")}
          ${num("MAX_TOKENS")}
          <select data-adv-key="${esc(key("FALLBACK_ENDPOINT"))}">${slotOptions(advValue(key("FALLBACK_ENDPOINT")).trim(), "不回退")}</select>
        </div>`;
    }

    /** Embedding 行：端点列固定灰显。向量维度随模型变，换一次整库都要重算，
     *  所以它**不随 LLM 一起切到在线**（方案 §11.3 R2）。 */
    function embeddingRowHTML() {
      return `
        <div class="svc-row svc-row-embed">
          <span class="svc-role"><b>语义检索 embedding</b><small>换模型等于换向量维度，整库都要重算，所以不随 LLM 切换。</small></span>
          <span class="svc-fixed" title="本地专用，不随 LLM 切换">本机（固定）</span>
          <input id="embedding_model" list="model-list" value="${esc(mainValue("embedding_model"))}"
                 placeholder="例如 text-embedding-model" />
          <span class="svc-fixed">—</span>
          <span class="svc-fixed">—</span>
          <span class="svc-fixed">—</span>
        </div>`;
    }

    function renderModelService() {
      const host = root.querySelector("#model-service");
      syncMain();  // 卡片里那四个真控件即将被重绘掉，先把值收进值仓
      const gate = advValue("MEMORY_EMBEDDING_GATE").trim() || "auto";
      const gateOptions = ["auto", "none", ...SLOT_NAMES];
      const fallback = advValue("LLM_FALLBACK_ENABLED").trim().toLowerCase() !== "false";
      host.innerHTML = `
        <div class="svc-cards">${SLOT_NAMES.map(endpointCardHTML).join("")}</div>
        <div class="svc-presets">
          <span>一键预设：</span>
          ${Object.entries(PRESETS).map(([id, preset]) =>
            `<button type="button" data-svc-preset="${esc(id)}">${esc(preset.name)}</button>`).join("")}
          <span class="config-status" id="svc-preset-status">预设只改「角色 → 端点」，不会动你填的地址和 key。</span>
        </div>
        <div class="svc-matrix">
          <div class="svc-row svc-row-head">
            <span>角色</span><span>端点</span><span>模型</span><span>温度</span><span>max_tokens</span><span>失败回退</span>
          </div>
          ${ROLE_BINDINGS.map(roleRowHTML).join("")}
          ${embeddingRowHTML()}
        </div>
        <div class="svc-foot">
          <label>端点失败时回退
            <select data-adv-key="LLM_FALLBACK_ENABLED">
              <option value="true" ${fallback ? "selected" : ""}>开启</option>
              <option value="false" ${fallback ? "" : "selected"}>关闭</option>
            </select>
          </label>
          <label>embedding 排队闸门
            <select data-adv-key="MEMORY_EMBEDDING_GATE">
              ${gateOptions.map(v => `<option value="${esc(v)}" ${v === gate ? "selected" : ""}>${esc(v)}</option>`).join("")}
            </select>
          </label>
          <span class="config-status">回退只在角色选了「失败回退」端点时才生效；冷却时间见高级配置 LLM_FALLBACK_COOLDOWN。</span>
        </div>
        <div class="svc-warn" id="svc-warn"></div>`;

      host.querySelectorAll(".svc-card-summary").forEach(summary => {
        summary.addEventListener("click", event => {
          event.preventDefault();
          toggleServiceCard(summary.closest(".svc-card"));
        });
      });
      host.querySelectorAll("[data-svc-preset]").forEach(button => {
        button.onclick = () => applyPreset(button.dataset.svcPreset);
      });
      host.querySelectorAll("[data-svc-test]").forEach(button => {
        button.onclick = () => testEndpoint(button.dataset.svcTest);
      });
      // 角色换端点 → 模型列跟着变（换端点就是换模型，这是本次改动的核心语义）。
      host.querySelectorAll("[data-role-endpoint]").forEach(select => {
        select.onchange = refreshServiceWarnings;
      });
      host.querySelectorAll("[data-adv-key]").forEach(input => {
        input.addEventListener("change", refreshServiceWarnings);
      });
      // 卡片里那四个主表单控件不带 data-adv-key（它们由 collect() 直接按 id 取），
      // 但角色行的模型列是从它们算出来的，所以边打字边刷新。
      for (const id of MAIN_IDS) {
        host.querySelector(`#${id}`)?.addEventListener("input", refreshServiceWarnings);
      }
      refreshServiceWarnings();
    }

    function applyPreset(id) {
      const preset = PRESETS[id];
      if (!preset) return;
      syncAdvanced();  // 先收编辑中的值，否则重绘会把用户刚打的字冲掉
      for (const [role, slot] of Object.entries(preset.map)) advancedValues[`LLM_ROLE_${role}_ENDPOINT`] = slot;
      renderModelService();
      root.querySelector("#svc-preset-status").textContent = `已套用「${preset.name}」，点保存后生效。`;
    }

    async function testEndpoint(slot) {
      const host = root.querySelector("#model-service");
      const button = host.querySelector(`[data-svc-test="${slot}"]`);
      const status = host.querySelector(`[data-svc-status="${slot}"]`);
      syncAdvanced();
      const url = effectiveUrl(slot);
      if (!url) {
        status.textContent = "还没有地址可测：填上面的「地址」，或让它继承到一个非空地址。";
        return;
      }
      const apiKey = effectiveApiKey(slot);
      if (slotKind(slot) === "online" && !apiKey) {
        status.textContent = "在线端点必须填 API key。";
        return;
      }
      button.disabled = true;
      status.textContent = `正在连 ${url} …`;
      try {
        const models = await listModels(url, apiKey);
        const options = models.map(m => `<option value="${esc(m)}"></option>`).join("");
        host.querySelector(`#svc-models-${slot}`).innerHTML = options;
        // 本机端点顺手把基础配置那几个模型 ID 的候选也填上，省一次「读取 LM Studio 模型」。
        if (slot === "LOCAL") root.querySelector("#model-list").innerHTML = options;
        status.textContent = models.length ? `连通，${models.length} 个可用模型已进候选` : "连通，但端点没报告任何模型";
      } catch (e) {
        status.textContent = `失败：${e}`;
      } finally {
        button.disabled = false;
      }
    }

    /** 保存前必须拦下的（方案 §6.1「在线端点若 API key 为空 → 前端即时拦截」）。
     *  这里只拦「一定跑不起来」的三类，其余交给保存后那次 doctor —— 判据集中在
     *  registry.validate() 一处，两边分级漂移比漏报更难查。 */
    function modelServiceProblems() {
      syncAdvanced();
      const problems = [];
      // 只检查**已配地址**的端点。四个槽是静态声明的，两个 ONLINE_* 出厂就写着
      // kind=online、地址与 key 都空 —— 按 kind 一刀切会让纯本地用户开局就看到两条
      // 永远修不掉的「没填 API key」，而后端 registry 对没配地址的槽本就当「未配置」
      // 直接跳过（endpoints() 里它是 None）。判据在这里跟后端对齐。
      for (const slot of SLOT_NAMES) {
        if (!effectiveUrl(slot)) continue;
        if (slotKind(slot) === "online" && !effectiveApiKey(slot)) {
          problems.push(`在线端点 ${slot}（${SLOT_LABEL[slot]}）填了地址但没填 API key，调用一定 401。`);
        }
      }
      const boundLabels = {};  // slot → [label]，报错文案里点名是谁在用
      for (const entry of ROLE_BINDINGS) {
        const slot = roleSlot(entry);
        if (isUnboundSlot(slot)) {
          // none 对任何角色都合法（后端 endpoint() 先 upper 再判），但只有声明了
          // unbindable 的角色「关」是设计态——别的角色被手写成 none 值得说一句。
          if (!entry.unbindable) problems.push(`${entry.label}的端点是 none（未绑定），该角色不会产生调用。`);
          continue;
        }
        (boundLabels[slot] = boundLabels[slot] || []).push(entry.label);
      }
      for (const slot of Object.keys(boundLabels)) {
        const who = boundLabels[slot].join("、");
        if (!SLOT_NAMES.includes(slot)) { problems.push(`${who}指向未知端点 ${slot}。`); continue; }
        if (!effectiveUrl(slot)) problems.push(`端点 ${slot}（${SLOT_LABEL[slot]}）有角色在用（${who}），但地址为空。`);
      }
      // 在线端点必须显式给模型：本机留空由服务端默认路由，在线厂商留空一律 400。
      // 后端 registry 把这条报成 error（保存后那次 doctor 一定会拦），所以这里也拦，
      // 只是能把话说得更具体：该去哪个框里填。
      for (const entry of ROLE_BINDINGS) {
        const slot = roleSlot(entry);
        if (isUnboundSlot(slot)) continue;  // 未绑定的角色不产生调用，不必有模型
        if (!SLOT_NAMES.includes(slot) || slotKind(slot) !== "online") continue;
        if (!effectiveUrl(slot)) continue;  // 上面已经报过「地址为空」了
        if (!effectiveModel(entry).model) {
          problems.push(`${entry.label}指向在线端点 ${slot}，但该端点没填模型 ID。`);
        }
      }
      return problems;
    }

    /** 角色行的模型列是算出来的，任何影响它的输入变了都要重算一遍。 */
    function refreshRoleModels() {
      const host = root.querySelector("#model-service");
      if (!host) return;
      for (const entry of ROLE_BINDINGS) {
        const cell = host.querySelector(`[data-role-model="${entry.role}"]`);
        if (cell) cell.outerHTML = roleModelCellHTML(entry);
      }
    }

    /** 拦不住但值得当场说的：都是「存得下、跑起来才炸」的那类。 */
    function refreshServiceWarnings() {
      syncAdvanced();
      refreshKindBadges();
      refreshRoleModels();
      const box = root.querySelector("#svc-warn");
      if (!box) return;
      const lines = modelServiceProblems().map(text => ({ level: "error", text }));
      const chatKey = effectiveApiKey("ONLINE_CHAT");
      const memoryKey = effectiveApiKey("ONLINE_MEMORY");
      if (chatKey && chatKey === memoryKey) {
        lines.push({ level: "warn", text: "两个在线端点用了同一把 API key：两边的提示词前缀会互相打断缓存，省钱的前提就没了。" });
      }
      // 「角色走在线端点却没有模型」已经在 modelServiceProblems() 里按 error 报了，
      // 这里只补一条隐私提醒：声明了 sendsContent 的角色（记忆域 + 图片转述）一旦
      // 指到在线端点，群聊内容就会发送到该服务商——VISION 发的是图片本身。
      for (const entry of ROLE_BINDINGS) {
        if (entry.sendsContent !== true) continue;
        const slot = roleSlot(entry);
        if (isUnboundSlot(slot) || !SLOT_NAMES.includes(slot)) continue;
        if (slotKind(slot) !== "online") continue;
        const content = entry.role === "VISION" ? "群聊图片" : "群聊原文";
        lines.push({ level: "warn", text: `${entry.label}指向在线端点，${content}会发送到该服务商。` });
      }
      box.innerHTML = lines.map(line => `<div class="svc-warn-line svc-${line.level}">${esc(line.text)}</div>`).join("");
    }

    /** 把所有 data-adv-key 控件的当前值收进 advancedValues。重绘前必须先调它，
     *  否则用户编辑中的值会被上一轮的旧值盖回去。 */
    function syncAdvanced() {
      syncMain();
      root.querySelectorAll("[data-adv-key]").forEach(input => {
        advancedValues[input.dataset.advKey] = input.value;
      });
      syncKinds();  // 类型没有控件，值只能由界面推导后写进来
    }

    function parseAdvanced() {
      const groups = new Map();
      for (const field of schemaFields) {
        if (managedKeys.has(field.key)) continue;
        const section = field.section || "其他设置";
        if (!groups.has(section)) groups.set(section, { title: section, items: [] });
        groups.get(section).items.push({
          key: field.key,
          value: advancedValues[field.key] ?? field.default ?? "",
          description: field.description || "",
          // 继承型配置项：schema 给不出字面默认值，只给「留空即继承谁」
          inherits: field.inherits || "",
          // 类型与可选项来自 schema（deploy/env_schema.py 按 _env* 助手名生成），
          // GUI 据此选控件形态并做输入校验
          type: field.type || "string",
          choices: field.choices || [],
        });
      }
      return [...groups.values()];
    }

    function renderAdvanced() {
      const groups = parseAdvanced();
      root.querySelector("#primary-groups")?.replaceChildren();
      root.querySelector("#advanced-groups").innerHTML = groups
        .filter(group => group.items.length)
        .map(groupHTML)
        .join("");
    }

    /** 按字段类型渲染控件：bool/choice 用下拉（非法值无从输入），int/float
     *  给数字键盘提示，其余保持自由文本框。 */
    function advancedControlHTML(item) {
      const key = esc(item.key);
      if (item.type === "bool") {
        const value = String(item.value).trim().toLowerCase();
        const current = ["false", "0", "no"].includes(value) ? "false" : "true";
        return `<select data-adv-key="${key}">
          <option value="true"${current === "true" ? " selected" : ""}>true</option>
          <option value="false"${current === "false" ? " selected" : ""}>false</option>
        </select>`;
      }
      if (item.type === "choice") {
        const choices = item.choices || [];
        const normalized = String(item.value).trim().toLowerCase();
        const exact = choices.find(choice => choice === normalized);
        let options = choices.map(choice =>
          `<option value="${esc(choice)}"${choice === exact ? " selected" : ""}>${esc(choice)}</option>`
        ).join("");
        // 存量 .env 里的非法值不能被下拉静默改写：原样保留为选项，交给校验标红
        if (!exact) {
          options = `<option value="${esc(String(item.value).trim())}" selected>${esc(String(item.value).trim())}（无效）</option>${options}`;
        }
        return `<select data-adv-key="${key}">${options}</select>`;
      }
      const inputmode = item.type === "int" ? ' inputmode="numeric"'
        : item.type === "float" ? ' inputmode="decimal"' : "";
      return `<input data-adv-key="${key}" value="${esc(item.value)}"${inputmode}${item.inherits ? ` placeholder="继承 ${esc(item.inherits)}"` : ""} />`;
    }

    /** 单字段校验。返回 null 表示通过，否则 {level: "error"|"warn", text}。
     *  error 拦截保存，warn 只提醒（时区这类无法本地判死的自由文本）。 */
    function validateAdvancedField(field, rawValue) {
      const value = String(rawValue ?? "").trim();
      // 继承型留空不落盘（见 buildAdvancedEnv），空值永不报错
      if (field.inherits && !value) return null;
      const lowered = value.toLowerCase();
      switch (field.type) {
        case "int":
          if (!/^-?\d+$/.test(value)) return { level: "error", text: "需要整数" };
          return null;
        case "float":
          if (value === "" || !Number.isFinite(parseFloat(value))) return { level: "error", text: "需要数字" };
          return null;
        case "int_set": {
          if (value === "") return null;
          const bad = value.split(",").map(part => part.trim()).find(part => part && !/^-?\d+$/.test(part));
          if (bad !== undefined) return { level: "error", text: `含非法整数「${bad}」，多个值用英文逗号分隔` };
          return null;
        }
        case "choice":
          if (value && !(field.choices || []).some(choice => choice === lowered)) {
            return { level: "error", text: `可选：${(field.choices || []).join(" / ")}` };
          }
          return null;
        case "string":
          // 时区是自由文本，但拼错的时区会在运行期被静默回退成服务器时区——提前提醒
          if (field.key === "USER_TIMEZONE" && value && !["local", "system"].includes(lowered)
            && typeof Intl !== "undefined" && Intl.supportedValuesOf) {
            const known = Intl.supportedValuesOf("timeZone").includes(value)
              || /^(gmt|utc)[+-]\d{1,2}(:\d{2})?$/.test(lowered)
              || /^[+-]\d{1,2}(:\d{2})?$/.test(lowered);
            if (!known) return { level: "warn", text: "不是常见 IANA 时区名或 UTC+X 偏移，运行期会回退为服务器本地时间" };
          }
          return null;
        default:
          return null;
      }
    }

    /** 全量重校验高级配置：行内标错/提醒，返回 error 级问题清单（供保存拦截）。 */
    function applyAdvancedValidation() {
      const problems = [];
      const byKey = new Map(schemaFields.map(field => [field.key, field]));
      root.querySelectorAll("[data-adv-field]").forEach(wrap => {
        const field = byKey.get(wrap.dataset.advField);
        const control = wrap.querySelector("[data-adv-key]");
        if (!field || !control) return;
        const msg = wrap.querySelector(".adv-msg");
        const issue = validateAdvancedField(field, control.value);
        if (!issue) {
          wrap.classList.remove("adv-invalid");
          msg.hidden = true;
          return;
        }
        if (issue.level === "error") problems.push(`${field.key}：${issue.text}`);
        wrap.classList.toggle("adv-invalid", issue.level === "error");
        msg.textContent = issue.text;
        msg.className = `adv-msg adv-${issue.level}`;
        msg.hidden = false;
      });
      return problems;
    }

    function groupHTML(group) {
      const body = `<div class="advanced-fields">${group.items.map(item => `
        <div class="advanced-field" data-adv-field="${esc(item.key)}">
          <label>${esc(item.key)}${item.description ? `<small>${esc(item.description)}</small>` : ""}${item.inherits ? `<small>留空即继承 ${esc(item.inherits)}</small>` : ""}</label>
          ${advancedControlHTML(item)}
          <span class="adv-msg" hidden></span>
        </div>`).join("")}</div>`;
      return `<section class="primary-config-group"><h3>${esc(group.title)}</h3>${body}</section>`;
    }

    function resetDefaults() {
      advancedValues = Object.fromEntries(schemaFields.map(field => [field.key, field.default ?? ""]));
      renderAdvanced();
      renderModelService();
      root.querySelector("#status").textContent = "已恢复高级配置默认值，点击保存后生效。";
    }

    function buildAdvancedEnv() {
      syncAdvanced();
      const values = { ...advancedValues };
      const known = new Set(schemaFields.map(field => field.key));
      // 继承型配置项留空时**不写入** .env。写成 `KEY=` 会让读取方拿到空串，
      // 继承链被静默切断——2026-08-28 之前 MEMORY_EXTRACT_LM_STUDIO_BASE_URL
      // 正是这样变成空串，使阶段2 候选提取每次都拼出无协议 URL 而失败。
      // 修复是三处协同的：config/settings.py 的 _env_inherit（空值回落）、
      // deploy/env_schema.py 输出 inherits 标记、以及这里的「留空不落盘」。
      const lines = schemaFields
        .filter(field => !(field.inherits && !String(values[field.key] ?? "").trim()))
        .map(field => `${field.key}=${values[field.key] ?? field.default ?? ""}`);
      for (const [key, value] of Object.entries(values)) {
        // SUPERSEDED 旧键不回写：它们已被合并器迁到新键并从 .env 移除，
        // 这里原样写回会让每次保存都把旧行复活（迁移永不彻底）。
        if (known.has(key) || supersededKeys.has(key)) continue;
        lines.push(`${key}=${value}`);
      }
      return lines.join("\n");
    }

    async function loadModels() {
      const button = root.querySelector("#btn-models");
      const status = root.querySelector("#status");
      button.disabled = true;
      status.textContent = "正在读取…";
      try {
        const models = await listModels(root.querySelector("#lm_base_url").value.trim());
        root.querySelector("#model-list").innerHTML = models.map(m => `<option value="${esc(m)}"></option>`).join("");
        status.textContent = models.length ? `已读取 ${models.length} 个模型` : "未发现已加载模型，可手工输入";
      } catch (e) {
        status.textContent = `读取失败：${e}`;
      } finally {
        button.disabled = false;
      }
    }

    async function save(event) {
      event.preventDefault();
      const button = root.querySelector("#btn-save");
      const status = root.querySelector("#status");
      const error = root.querySelector("#error");
      if (!configSynced) {
        status.textContent = "配置仍在同步，请稍候再保存。";
        return;
      }
      button.disabled = true;
      error.textContent = "";
      // 先做前端拦截：这几类问题存下去也只是让 doctor 再报一次，不如当场说清楚。
      const problems = modelServiceProblems();
      // 高级配置的非法值同样当场拦下：存下去 Python 侧只会告警回退，
      // 用户却不知道自己填的东西从来没生效过。
      const advancedErrors = applyAdvancedValidation();
      if (advancedErrors.length) {
        const all = [...problems, ...advancedErrors];
        const head = problems.length ? "配置还有问题，先修好再保存："
          : "高级配置还有非法值，先修好再保存：";
        error.innerHTML = [head, ...all.map(t => `· ${esc(t)}`)].join("<br />");
        root.querySelector(".adv-invalid [data-adv-key]")?.focus();
        status.textContent = "未保存";
        button.disabled = false;
        return;
      }
      if (problems.length) {
        error.innerHTML = ["模型服务还有问题，先修好再保存：", ...problems.map(t => `· ${esc(t)}`)].join("<br />");
        status.textContent = "未保存";
        button.disabled = false;
        return;
      }
      status.textContent = "正在保存并检查…首次配置可能需要一点时间。";
      try {
        await saveConfig(collect());
        const doctor = await runDoctor();
        if (doctor.summary?.blocking) {
          navigateToPage("./doctor.html", { replace: true });
        } else {
          navigateToPage("./run.html", { replace: true });
        }
      } catch (e) {
        error.textContent = String(e);
        status.textContent = "保存失败";
        button.disabled = false;
      }
    }

    const cachedConfigData = readViewCache("config");
    if (cachedConfigData) {
      applyConfigState(fromCachedConfig(cachedConfigData));
      lastConfigSig = stableSignature(cachedConfigData);
      render();
    } else {
      config = EMPTY_CONFIG;
      render();
    }
    getConfig().then(data => {
      const snapshot = configSnapshot(data);
      const changed = !lastConfigSig || stableSignature(snapshot) !== lastConfigSig;
      applyConfigState(data);
      configSynced = true;
      lastConfigSig = stableSignature(snapshot);
      writeViewCache("config", snapshot);
      if (changed) {
        render();
      } else {
        syncSecretInputs(data);
      }
    }).catch(e => {
      if (!lastConfigSig) root.querySelector("#error").textContent = `无法读取最新配置：${e}`;
    });

    renderPersonaPending();
    getPersonas().then(data => {
      personas = data;
      personasSynced = true;
      renderPersona();
    }).catch(error => {
      personasSynced = true;
      const host = root.querySelector("#persona-settings");
      if (host) host.innerHTML = `<div class="notice notice-error">无法读取人格：<code>${esc(error)}</code></div>`;
    });
  </script>
</body>
</html>
